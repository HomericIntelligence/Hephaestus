# Ambient-reader projection of hephaestus/config/environment_registry.py for
# hephaestus/**/*.py. Names and reader identities are exact; dynamic access,
# bulk access, and wildcards are forbidden.
schema_version = 1

[[variables]]
name = "APPDATA"
category = "platform"
owner = "config.child_environments"
purpose = "Windows application configuration"
sensitivity = "sensitive"
validation = "path"
direction = "input"
readers = [
  { path = "hephaestus/config/child_environments.py", reader = "read_approved_parent_env", access = "read" },
]

[[variables]]
name = "COMSPEC"
category = "platform"
owner = "config.child_environments"
purpose = "Windows command processor alias"
sensitivity = "public"
