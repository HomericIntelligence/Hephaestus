[coverage]
# Aggregate coverage threshold
minimum = 85

# Per-module coverage floors
# Paths must match Cobertura XML <class filename="..."> attribute exactly.
# New entries must select metric = "line" or "branch"; entries without metric
# retain the legacy branch-if-positive/otherwise-line behavior.
[coverage.modules]
"validation/schema.py" = { minimum = 80 }
"automation/models.py" = { minimum = 90 }
"automation/dependency_resolver.py" = { minimum = 74 }

"automation/implementer.py" = { minimum = 70, metric = "line" }
"automation/planner.py" = { minimum = 70, metric = "line" }
"automation/loop_runner.py" = { minimum = 70, metric = "line" }
"automation/loop_repo_manager.py" = { minimum = 70, metric = "line" }
"automation/address_review_core.py" = { minimum = 70, metric = "line" }
"automation/pipeline_cli.py" = { minimum = 70, metric = "line" }
