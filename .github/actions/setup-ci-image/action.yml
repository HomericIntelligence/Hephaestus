name: Prepare the shared CI image
description: >-
  Pull the published CI image and tag it as the local reference the existing
  container steps already use. Falls back to building the image when the pull
  fails, so a registry fault cannot block a required check.

inputs:
  image:
    description: >-
      Pinned image reference from the Publish CI Image workflow output, as
      ghcr.io/OWNER/REPO@sha256:DIGEST.
    required: true
  local-tag:
    description: Local tag the container steps use as their image reference.
    required: false
    default: hephaestus-ci:local

runs:
  using: composite
  steps:
    - name: Pull the published CI image
      id: pull
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        LOCAL_TAG: ${{ inputs.local-tag }}
      run: |
        set -euo pipefail
        if [ -z "${IMAGE}" ] || ! printf '%s' "${IMAGE}" | grep -qE '@sha256:[0-9a-f]{64}$'; then
          echo "No pinned image reference was supplied; the image will be built."
          echo "pulled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if podman pull "${IMAGE}" >/dev/null 2>&1; then
          podman tag "${IMAGE}" "${LOCAL_TAG}"
          echo "Using published image ${IMAGE}"
          echo "pulled=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Could not pull ${IMAGE}; building the CI image instead."
          echo "pulled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the CI image
      if: steps.pull.outputs.pulled != 'true'
      shell: bash
      env:
        LOCAL_TAG: ${{ inputs.local-tag }}
      run: podman build --jobs=2 -f ci/Containerfile -t "${LOCAL_TAG}" .
