name: Setup Pi CLI
description: Install the real Earendil Works Pi coding-agent CLI for tests.

runs:
  using: composite
  steps:
    - name: Set up Node.js for Pi
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22.19.0

    - name: Install Pi CLI
      shell: bash
      run: |
        set -euo pipefail
        pi_spec="$(node -e 'const p=require("./hephaestus/agents/pi_package_catalog.json").compatibility.pi; process.stdout.write(`${p.npm_name}@${p.version}`)')"
        expected="${pi_spec##*@}"
        npm install -g --ignore-scripts "$pi_spec"
        test "$(pi --version)" = "$expected"
