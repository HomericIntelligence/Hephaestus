name: Contract Tests (opt-in)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  github-contract:
    name: GitHub contract lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked

      - name: Run contract lane (agent tests self-skip without the second opt-in)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run pytest tests/integration/contract
          --run-contract-tests
          --contract-repo "${{ github.repository }}"
          --override-ini="addopts=" -v --strict-markers
