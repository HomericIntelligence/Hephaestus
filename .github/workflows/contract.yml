name: Contract Tests (opt-in)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  # The retained governance check (issue #2853). The protected signed tag
  # agent-contract-v1.0.0 and its immutable release pin this external
  # provider; retargeting the tag is the operator-visible update path (see
  # SECURITY.md). A full-length commit SHA is not applicable to the
  # tag-based released contract.
  agent-contract:
    uses: HomericIntelligence/Athena/.github/workflows/_agent-contract.yml@agent-contract-v1.0.0  # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
  github-contract:
    name: GitHub contract lane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [agent-contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked

      - name: Run contract lane (agent tests self-skip without the second opt-in)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run pytest tests/integration/contract
          --run-contract-tests
          --contract-repo "${{ github.repository }}"
          --override-ini="addopts=" -v --strict-markers
