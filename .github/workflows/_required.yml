# Platform scope: Linux-only. macOS/Windows CI is out of scope and
# tracked in #539. Published wheels remain pure-Python importable elsewhere.
# When #539 lands, expand the matrix to include macOS and Windows runners.
name: Required Checks

on:
  pull_request:
    # This workflow is the sole source of code-validation contexts. Label and
    # auto-merge events remain outside this workflow: a skipped heavy job reports a successful context, so allowing
    # those events here could mask a still-running or failed code-event check.
    types:
      - opened
      - synchronize
      - edited
      - reopened
      - ready_for_review
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: required-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The trigger admits only code and merge-group events, so every dependent job
  # runs. Retain a single output because the code-event contract is consumed by
  # each job and makes a future trigger broadening explicit in review.
  changes-gate:
    name: changes-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code_event: ${{ steps.decide.outputs.code_event }}
    steps:
      - name: Decide whether this event runs the heavy jobs
        id: decide
        env:
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          echo "code_event=true" >> "$GITHUB_OUTPUT"
          echo "Code or merge-group event (${ACTION:-push}) — all validation jobs run."

  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            msg='::error::Found "continue-on-error: true" above.'
            msg+=' Fix the root cause per HomericIntelligence/Odysseus#280.'
            echo "$msg"
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

      - name: "Reject advisory annotation pattern"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          # The advisory-annotation pattern in workflow run blocks is morally
          # equivalent to continue-on-error: true: it lets a tool fail without
          # failing the CI step. The runbook (Bucket F) requires every tool
          # to be fail-fast. The only legitimate annotation is informational
          # text not tied to a tool's exit code — those should use
          # echo "WARN:" to stdout instead. See docs/runbooks/no-silent-failures.md.
          declare -a scan_files=()
          for f in "${files[@]}"; do
            # Exempt this workflow file (heredoc would otherwise self-match).
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nF '::warning::' "${scan_files[@]}"; then
            echo ""
            msg='::error::Found advisory annotations above.'
            msg+=' Make the underlying tool fail-fast or use echo "WARN:" to stdout.'
            msg+=' See HomericIntelligence/Odysseus#282 Bucket F.'
            echo "$msg"
            exit 1
          fi
          echo 'OK: no advisory annotations found'

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Single source of truth for linting: run the full pre-commit hook suite.
      # ruff-check, ruff-format, yamllint, and mypy all run as pre-commit hooks,
      # so invoking them as separate steps here would duplicate that work. The
      # standalone "Pre-commit" workflow was folded into this required `lint`
      # job (issue #1173) so that the WHOLE hook suite is a required status
      # check — previously pre-commit was advisory, which let an unformatted
      # file land on main via #959 and break pre-commit for every later PR.
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Cache mypy incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          # Persist incremental cache so the full-tree mypy hook (pass_filenames: false)
          # re-checks only changed modules across CI runs. See issue #1503.
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Run pre-commit (all hooks, in container)
        run: |
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            hephaestus-ci:local uv run pre-commit run --all-files --show-diff-on-failure

      - name: Validate documentation links (in container)
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run hephaestus-validate-links docs --repo-root .

      - name: Upload pre-commit diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pre-commit-diffs
          retention-days: 7
          path: |
            .git/pre-commit-*

  uv-lock-check:
    name: uv-lock-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint, changes-gate]
    if: needs.changes-gate.outputs.code_event == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .
      - name: Check uv.lock is in sync with pyproject.toml (in container)
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv lock --check

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint, changes-gate]
    if: needs.changes-gate.outputs.code_event == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: [lint, changes-gate]
    if: needs.changes-gate.outputs.code_event == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint, changes-gate]
    if: needs.changes-gate.outputs.code_event == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the shared CI image
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .
      - name: Run ShellCheck through the local CI runner
        env:
          CONTAINER_ENGINE: podman
        run: bash scripts/run_ci_local.sh shellcheck

  pr-policy:
    name: pr-policy
    # Enforces the three HARD repo PR policies on every PR. All checks are gated
    # by `if: always()` so one failure still surfaces the others:
    #   1. PR body contains `Closes #N` on its own line.
    #   2. The PR title and every branch commit subject follow the accepted
    #      Conventional Commit policy.
    #   3. Every branch commit carries a DCO Signed-off-by trailer.
    # Push events are skipped because there is no PR to inspect. On HEADGREEN
    # merge queues, the synthetic group head alone is checked, so merge-group
    # events fail closed unless every source PR represented by the exact
    # synthetic group head has a successful GitHub-Actions-owned pr-policy
    # check on its current head.
    #
    # This gate intentionally has NO `needs:` — it runs immediately so the
    # policy checks report without depending on another job's timing.
    # The earlier `needs: lint` workaround (#680) only delayed the read and left
    # a required-check-skipped-on-lint-failure wrinkle.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Resolve complete merge-group membership
        id: resolve_queue
        if: github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          REPOSITORY: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          queue_json="$RUNNER_TEMP/merge-queue-pages.json"
          queue_selection="$RUNNER_TEMP/merge-queue-selection.json"
          queue_members="$RUNNER_TEMP/queue-members.tsv"
          base_branch="${BASE_REF#refs/heads/}"
          head_ref="${HEAD_REF#refs/heads/}"
          queue_prefix="gh-readonly-queue/${base_branch}/pr-"
          if [[ "$head_ref" != "$queue_prefix"* ]]; then
            echo "::error::Unexpected merge-group head ref: $HEAD_REF"
            exit 1
          fi
          queue_tail="${head_ref#"$queue_prefix"}"
          if [[ ! "$queue_tail" =~ ^([1-9][0-9]*)-([0-9a-f]{40})$ ]]; then
            echo "::error::Unable to resolve source PR from merge-group head ref"
            exit 1
          fi
          PR_NUMBER="${BASH_REMATCH[1]}"
          queued_base="${BASH_REMATCH[2]}"

          query='query($owner:String!,$name:String!,$pr:Int!,$endCursor:String) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$pr) {
                number
                state
                headRefOid
                mergeQueueEntry {
                  position
                  baseCommit { oid }
                  headCommit { oid }
                  mergeQueue {
                    entries(first:100, after:$endCursor) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        position
                        baseCommit { oid }
                        headCommit { oid }
                        pullRequest { number state headRefOid }
                      }
                    }
                  }
                }
              }
            }
          }'
          gh api graphql --paginate --slurp -f query="$query" \
            -F owner="$REPO_OWNER" -F name="$REPO_NAME" -F pr="$PR_NUMBER" \
            > "$queue_json"
          jq -er \
            --argjson target_number "$PR_NUMBER" \
            --arg queued_base "$queued_base" \
            --arg group_head "$MERGE_GROUP_SHA" '
            . as $pages
            | select(($pages | length) > 0)
            | select(all($pages[]; ((.errors // []) | length) == 0))
            | select(all(range(0; ($pages | length) - 1);
                $pages[.].data.repository.pullRequest.mergeQueueEntry
                  .mergeQueue.entries.pageInfo.hasNextPage == true and
                ($pages[.].data.repository.pullRequest.mergeQueueEntry
                  .mergeQueue.entries.pageInfo.endCursor
                  | type == "string" and length > 0)
              ))
            | select(
                $pages[-1].data.repository.pullRequest.mergeQueueEntry
                  .mergeQueue.entries.pageInfo.hasNextPage == false
              )
            | select(([
                $pages[].data.repository.pullRequest.mergeQueueEntry
                  .mergeQueue.entries.pageInfo.endCursor
                | select(. != null)
              ] | length) == ([
                $pages[].data.repository.pullRequest.mergeQueueEntry
                  .mergeQueue.entries.pageInfo.endCursor
                | select(. != null)
              ] | unique | length))
            | ([
                $pages[].data.repository.pullRequest
                | {
                    number,
                    state,
                    headRefOid,
                    position: .mergeQueueEntry.position,
                    base: .mergeQueueEntry.baseCommit.oid,
                    head: .mergeQueueEntry.headCommit.oid
                  }
              ] | unique) as $targets
            | select(($targets | length) == 1)
            | $pages[0].data.repository.pullRequest as $target
            | select(
                $target.number == $target_number and
                $target.state == "OPEN"
              )
            | $target.mergeQueueEntry as $target_entry
            | ([
                $pages[].data.repository.pullRequest.mergeQueueEntry
                  .mergeQueue.entries.totalCount
              ] | unique) as $counts
            | ([
                $pages[].data.repository.pullRequest.mergeQueueEntry
                  .mergeQueue.entries.nodes[]
              ] | sort_by(.position)) as $entries
            | select($target_entry.baseCommit.oid == $queued_base)
            | select($target_entry.headCommit.oid == $group_head)
            | select(($counts | length) == 1 and $counts[0] == ($entries | length))
            | ([
                $entries[]
                | select(.position <= $target_entry.position)
              ] | sort_by(.position)) as $members
            | select(($members | length) > 0)
            | select(($members | map(.position) | unique | length) == ($members | length))
            | select(
                ($members | map(.pullRequest.number) | unique | length) ==
                ($members | length)
              )
            | select(
                $members[-1].pullRequest.number == $target_number and
                $members[-1].headCommit.oid == $group_head
              )
            | select(all($members[];
                .pullRequest != null and
                .pullRequest.state == "OPEN" and
                (.pullRequest.headRefOid | test("^[0-9a-f]{40}$"))
              ))
            | select(all(range(1; $members | length);
                $members[.].baseCommit.oid == $members[. - 1].headCommit.oid
              ))
            | select($members[0].baseCommit.oid | test("^[0-9a-f]{40}$"))
            | {
                queue_root: $members[0].baseCommit.oid,
                members: [
                  $members[]
                  | {
                      number: .pullRequest.number,
                      head: .pullRequest.headRefOid
                    }
                ]
              }
          ' "$queue_json" > "$queue_selection"
          jq -er '.members[] | [.number, .head] | @tsv' \
            "$queue_selection" > "$queue_members"
          test -s "$queue_members"
          queue_root=$(jq -er '.queue_root' "$queue_selection")
          echo "queue_root=$queue_root" >> "$GITHUB_OUTPUT"

      # HEADGREEN's event base can be the preceding synthetic queue commit.
      # Resolve the first member's protected root before loading validators so
      # an earlier queued PR cannot replace the policy implementation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          ref: ${{ steps.resolve_queue.outputs.queue_root }}
          path: policy-base
          persist-credentials: false

      - name: Revalidate source PR policy
        if: github.event_name == 'merge_group'
        env:
          REPOSITORY: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          queue_members="$RUNNER_TEMP/queue-members.tsv"

          commit_query='query($owner:String!,$name:String!,$pr:Int!,$after:String) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$pr) {
                number
                state
                headRefOid
                commits(first:100, after:$after) {
                  totalCount
                  nodes { commit { oid message } }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }'

          while IFS=$'\t' read -r source_pr source_head; do
            source_prefix="$RUNNER_TEMP/source-pr-${source_pr}"
            source_metadata="${source_prefix}-metadata.json"
            source_nodes="${source_prefix}-commit-nodes.jsonl"
            source_page="${source_prefix}-commit-page.json"
            source_initial="${source_prefix}-initial-canonical.json"
            source_final="${source_prefix}-final-canonical.json"

            gh pr view "$source_pr" --repo "$REPOSITORY" \
              --json author,body,headRefOid,state,title > "$source_metadata"
            jq -e --arg head "$source_head" '
              .state == "OPEN" and .headRefOid == $head
            ' "$source_metadata" > /dev/null

            : > "$source_nodes"
            cursor=""
            expected_total=""
            declare -A seen_cursors=()
            while true; do
              if [ -n "$cursor" ]; then
                gh api graphql -f query="$commit_query" \
                  -F owner="$REPO_OWNER" -F name="$REPO_NAME" -F pr="$source_pr" \
                  -F after="$cursor" > "$source_page"
              else
                gh api graphql -f query="$commit_query" \
                  -F owner="$REPO_OWNER" -F name="$REPO_NAME" -F pr="$source_pr" \
                  > "$source_page"
              fi
              jq -e --argjson number "$source_pr" --arg head "$source_head" '
                ((.errors // []) | length) == 0
                and (.data.repository.pullRequest as $pr
                  | $pr.number == $number
                  and $pr.state == "OPEN"
                  and $pr.headRefOid == $head
                  and ($pr.commits.totalCount | type) == "number"
                  and $pr.commits.totalCount > 0
                  and ($pr.commits.pageInfo.hasNextPage | type) == "boolean"
                  and all($pr.commits.nodes[];
                    (.commit.oid | test("^[0-9a-f]{40}$"))
                    and (.commit.message | type) == "string"
                  ))
              ' "$source_page" > /dev/null
              page_total=$(jq -er \
                '.data.repository.pullRequest.commits.totalCount' "$source_page")
              if [ -z "$expected_total" ]; then
                expected_total="$page_total"
              else
                test "$page_total" -eq "$expected_total"
              fi
              jq -c '.data.repository.pullRequest.commits.nodes[]' "$source_page" \
                >> "$source_nodes"
              has_next=$(jq -r \
                '.data.repository.pullRequest.commits.pageInfo.hasNextPage' "$source_page")
              case "$has_next" in
                false) break ;;
                true)
                  cursor=$(jq -r \
                    '.data.repository.pullRequest.commits.pageInfo.endCursor // empty' \
                    "$source_page")
                  test -n "$cursor"
                  test -z "${seen_cursors[$cursor]+present}"
                  seen_cursors["$cursor"]=1
                  ;;
                *) exit 1 ;;
              esac
            done
            test -s "$source_nodes"
            actual_total=$(wc -l < "$source_nodes" | tr -d ' ')
            unique_total=$(jq -r '.commit.oid' "$source_nodes" | sort -u | wc -l | tr -d ' ')
            test "$actual_total" -eq "$expected_total"
            test "$unique_total" -eq "$expected_total"
            last_oid=$(tail -n 1 "$source_nodes" | jq -er '.commit.oid')
            test "$last_oid" = "$source_head"

            author=$(jq -r '.author.login // ""' "$source_metadata")
            body=$(jq -r '.body // ""' "$source_metadata")
            if [ "$author" != "dependabot[bot]" ]; then
              printf '%s\n' "$body" | grep -qE '^Closes #[0-9]+[[:space:]]*$'
            fi

            title=$(jq -r '.title // ""' "$source_metadata")
            [[ "$title" != *$'\n'* && "$title" != *$'\r'* ]]
            printf '%s\n' "$title" \
              | python3 policy-base/scripts/check_conventional_commit.py -
            printf '%s\n' "$title" | grep -qE \
              '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([^()]+\))?!?: .+$'
            jq -r '.commit.message | split("\n")[0]' "$source_nodes" \
              | python3 policy-base/scripts/check_conventional_commit.py -
            if [ "$author" != "dependabot[bot]" ]; then
              jq -j '.commit.message + "\u0000"' "$source_nodes" \
                | python3 policy-base/scripts/check_dco_signoff.py -
            fi

            # GitHub has no transactionally immutable PR-metadata endpoint.
            # Exact ordered commit OIDs, cardinality, tip, and this full final
            # metadata rebind fail closed on observable drift. A complete ABA
            # force-push/edit cycle between reads is an accepted residual race
            # for this single-maintainer repository.
            jq -S -c '{author,body,headRefOid,state,title}' \
              "$source_metadata" > "$source_initial"
            gh pr view "$source_pr" --repo "$REPOSITORY" \
              --json author,body,headRefOid,state,title \
              > "${source_prefix}-final.json"
            jq -e --arg head "$source_head" '
              .state == "OPEN" and .headRefOid == $head
            ' "${source_prefix}-final.json" > /dev/null
            jq -S -c '{author,body,headRefOid,state,title}' \
              "${source_prefix}-final.json" > "$source_final"
            cmp -s "$source_initial" "$source_final"
          done < "$queue_members"

      # The policy validator must come from the trusted base revision, never
      # from the PR head. The base checkout also provides the bootstrap path for
      # this rollout: the strict title shape is checked below while the strict
      # validator interface is introduced by this PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy-base
          persist-credentials: false

      - name: "Fetch PR metadata"
        id: fetch
        if: github.event_name == 'pull_request'
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # `gh pr view --json body,title` exposes the PR body (for the Closes #N
          # check) and title; the paginated GraphQL query supplies complete
          # commit messages for the Conventional Commit and DCO checks.
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json body,title \
            > pr.json
          query='query($owner:String!,$name:String!,$pr:Int!,$after:String) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$pr) {
                commits(first:100, after:$after) {
                  nodes {
                    commit {
                      message
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }'
          nodes_file="$RUNNER_TEMP/pr-commit-nodes.jsonl"
          page_file="$RUNNER_TEMP/pr-commit-page.json"
          : > "$nodes_file"
          cursor=""
          while true; do
            if [ -n "$cursor" ]; then
              gh api graphql \
                -f query="$query" \
                -F owner="$REPO_OWNER" -F name="$REPO_NAME" -F pr="$PR_NUMBER" \
                -F after="$cursor" > "$page_file"
            else
              gh api graphql \
                -f query="$query" \
                -F owner="$REPO_OWNER" -F name="$REPO_NAME" -F pr="$PR_NUMBER" \
                > "$page_file"
            fi
            jq -c '.data.repository.pullRequest.commits.nodes[]' "$page_file" \
              >> "$nodes_file"
            has_next=$(jq -r '.data.repository.pullRequest.commits.pageInfo.hasNextPage' \
              "$page_file")
            case "$has_next" in
              false) break ;;
              true)
                cursor=$(jq -r '.data.repository.pullRequest.commits.pageInfo.endCursor // empty' \
                  "$page_file")
                if [ -z "$cursor" ]; then
                  echo '::error::Commit page omitted endCursor while hasNextPage=true'
                  exit 1
                fi
                ;;
              *)
                echo '::error::Commit page omitted a valid pageInfo.hasNextPage value'
                exit 1
                ;;
            esac
          done
          jq -n --slurpfile nodes "$nodes_file" \
            '{data:{repository:{pullRequest:{commits:{nodes:$nodes}}}}}' \
            > commits.json
          echo "Fetched metadata for PR #$PR_NUMBER"

      - name: "Check 1: PR body contains 'Closes #N'"
        if: >-
          github.event_name == 'pull_request' && always() &&
          steps.fetch.outcome == 'success'
        env:
          # PR author login (github.event.pull_request.user.login), passed via
          # env so the untrusted value never interpolates into the run script.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Dependabot PR bodies are auto-generated and structurally never carry
          # a `Closes #N` line. Exempt ONLY this body check for dependabot[bot]
          # (#1070) — the commit metadata checks still apply.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "OK: Dependabot PR — 'Closes #N' body check is not applicable"
            exit 0
          fi
          # jq -r reads the untrusted body into a shell variable; downstream
          # use is `printf '%s\n' "$body" | grep`, which never word-splits or
          # interprets the body as a command, so injection is not possible.
          body=$(jq -r '.body // ""' pr.json)
          if printf '%s\n' "$body" | grep -qE '^Closes #[0-9]+[[:space:]]*$'; then
            echo "OK: PR body contains a Closes #N line"
          else
            msg='::error::PR body must contain a line matching `^Closes #N$`'
            msg+=' (literal "Closes", capital C, on its own line). See AGENTS.md PR policy.'
            echo "$msg"
            exit 1
          fi

      - name: "Check 2: PR title and commit subjects follow Conventional Commits"
        if: >-
          github.event_name == 'pull_request' && always() &&
          steps.fetch.outcome == 'success'
        run: |
          set -euo pipefail
          # The PR title becomes the main-branch subject after the required
          # squash merge, so Git-generated machinery exceptions are disabled.
          # The validator is read from the trusted base checkout. During the
          # rollout of strict title mode (#2157), the base validator predates
          # --strict; the anchored shape check below is the explicit bootstrap
          # path and remains a defense-in-depth check after the rollout.
          title=$(jq -r '.title // ""' pr.json)
          if [[ "$title" == *$'\n'* || "$title" == *$'\r'* ]]; then
            echo '::error::PR title must be a single line'
            exit 1
          fi
          printf '%s\n' "$title" \
            | python3 policy-base/scripts/check_conventional_commit.py -
          if ! printf '%s\n' "$title" | grep -qE \
            '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([^()]+\))?!?: .+$'; then
            echo '::error::PR title must match strict Conventional Commits form'
            exit 1
          fi
          # Subject = first line of each commit message (GraphQL .commit.message
          # verified to resolve). Branch commits retain the validator's
          # Git-machinery compatibility. Pipe on stdin, one per line, into the
          # trusted base validator (DoD row 5 / issue #1209). Empty set passes
          # by design.
          jq -r '.data.repository.pullRequest.commits.nodes[]
                 | .commit.message | split("\n")[0]' commits.json \
            | python3 policy-base/scripts/check_conventional_commit.py -

      - name: "Check 3: every commit carries a DCO Signed-off-by trailer"
        if: >-
          github.event_name == 'pull_request' && always() &&
          steps.fetch.outcome == 'success'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Dependabot commits are bot-authored, not human DCO attestations;
          # exempt like Check 1 (#1070).
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "OK: Dependabot PR — DCO sign-off check is not applicable"
            exit 0
          fi
          # Full commit message per node, NUL-separated (the trailer lives in
          # the body, so unlike Check 2 we keep the whole message). Reuses the
          # commits.json already fetched above. Empty set passes by design.
          jq -j '.data.repository.pullRequest.commits.nodes[]
                 | .commit.message + "\u0000"' commits.json \
            | python3 policy-base/scripts/check_dco_signoff.py -

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags so test_version_currency can resolve the
          # latest vX.Y.Z tag for the doc-version-drift guard (#1233).
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Pi CLI
        uses: ./.github/actions/setup-pi-cli

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .


      - name: Run unit tests (in container)
        run: |
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            hephaestus-ci:local bash -c '
            uv run pytest tests/unit --override-ini="addopts=" -v --strict-markers -m "not nightly" \
              --cov=hephaestus --cov-report=term-missing --cov-report=xml
          '

      - name: Check unit test structure (in container)
        # Use the strict CLI (also flags loose test_*.py files at tests/unit/ root).
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run hephaestus-check-test-structure

      - name: Check per-module coverage floors (in container)
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run hephaestus-check-coverage
          --coverage-file coverage.xml --config coverage.toml

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .


      - name: Run integration tests (in container)
        # The baked image installs every [project.scripts] binary into the venv,
        # so the CLI entry-point checks must never skip here (#2173).
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run pytest tests/integration
          --require-cli
          --override-ini="addopts=" --basetemp=build/pytest-integration
          -v --strict-markers -m "not nightly and not artifact"

  installed-cli-tests:
    # Installed-artifact lane (#2173): build the wheel, install it into a
    # fresh non-editable venv, and exercise every console binary from PATH
    # with skipping forbidden. Proves end-users' `pip install` artifacts
    # actually expose working CLIs — the editable uv env above cannot.
    name: installed-cli-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # hatch-vcs derives the wheel version from git tags.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Build wheel (in container)
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv build --wheel

      - name: Install wheel into fresh venv (in container)
        # [automation] extra: most console scripts live under
        # hephaestus.automation.*. pytest runs the suite; pyyaml is
        # imported by tests/conftest.py.
        run: |
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            hephaestus-ci:local bash -c '
            uv venv build/cli-venv
            WHEEL=(dist/*.whl)
            uv pip install --python build/cli-venv/bin/python "${WHEEL[0]}[automation]" pytest pyyaml
          '

      - name: Run CLI entry-point tests against installed binaries (in container)
        run: |
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            hephaestus-ci:local bash -c '
            export PATH="$PWD/build/cli-venv/bin:$PATH"
            build/cli-venv/bin/pytest tests/integration/test_cli_entry_points.py \
              --require-cli --override-ini="addopts=" -v --strict-markers
          '

  shell-tests:
    name: shell-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the shared CI image
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Run Bats through the local CI runner
        env:
          CONTAINER_ENGINE: podman
        run: bash scripts/run_ci_local.sh shell-tests

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .


      - name: Validate reproducible artifacts and package lifecycle
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run pytest tests/integration
          --override-ini="addopts=" --basetemp=build/pytest-artifacts
          -v --strict-markers -m artifact

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .


      - name: Run pip-audit (in container)
        id: pip-audit
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run pip-audit

      - name: Post pip-audit summary
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.pip-audit.outcome }}
        run: |
          {
            echo "## pip-audit Security Scan"
            echo ""
            if [ "$AUDIT_OUTCOME" = "success" ]; then
              echo "No HIGH/CRITICAL vulnerabilities found."
            else
              echo "Vulnerabilities detected — see job logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Digest-pinned so the scan no longer depends on a transient GitHub
      # Releases tarball URL (audit #1483). gitleaks is not published on
      # PyPI, so its image digest is the reproducible pin; it remains
      # container digest is the reproducible pin instead. Run via `docker
      # run` rather than a job-level `container:` — the gitleaks image is
      # musl-based Alpine with no Node.js runtime, which breaks
      # actions/checkout (a glibc-linked JS action) when it executes inside
      # the container.
      - name: Run Gitleaks
        env:
          GITLEAKS_IMAGE: >-
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          set -euo pipefail
          args=(detect --source=. --verbose --exit-code=1)
          if [ -f .gitleaks.toml ]; then
            args+=(--config=.gitleaks.toml)
          fi
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" "${args[@]}"

  security-sast-scan:
    name: security/sast-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Run bandit (SAST, in container)
        id: bandit
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run bandit -c pyproject.toml -r hephaestus scripts
          --severity-level medium

      - name: Post bandit summary
        if: always()
        env:
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
        run: |
          {
            echo "## Bandit Static Application Security Testing"
            echo ""
            if [ "$BANDIT_OUTCOME" = "success" ]; then
              echo "No security issues found."
            else
              echo "Security issues detected — see job logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security-workflow-scan:
    name: security/workflow-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Run zizmor (GitHub Actions SAST)
        id: zizmor
        # Offline + medium threshold: deterministic, network-free PR gate.
        # Online audits (e.g. known-vulnerable-actions) run weekly in
        # security.yml. Keep these flags and targets identical to the zizmor
        # pre-commit hook (drift-guarded by tests/unit/ci/test_zizmor_config.py).
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run zizmor --no-online-audits --min-severity medium
          .github/workflows/ .github/actions/

      - name: Post zizmor summary
        if: always()
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          {
            echo "## zizmor GitHub Actions SAST"
            echo ""
            if [ "$ZIZMOR_OUTCOME" = "success" ]; then
              echo "No workflow or composite-action findings at medium+ severity."
            else
              echo "GitHub Actions security findings detected — see job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Validate GitHub workflow schemas (in container)
        run: |
          set -euo pipefail
          # Use check-jsonschema's bundled `vendor.github-workflows` schema so
          # the job is network-free and fail-fast. No schemastore.org probe and
          # no advisory `::warning::` outage fallback (Bucket F anti-pattern).
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            hephaestus-ci:local bash -ceu '
            mapfile -t wf_files < <(find .github/workflows -name "*.yml")
            if [ "${#wf_files[@]}" -eq 0 ]; then
              echo "No workflow files to validate"
              exit 0
            fi
            UV_NO_SYNC=1 UV_OFFLINE=1 uv run check-jsonschema \
              --builtin-schema vendor.github-workflows \
              "${wf_files[@]}"
          '

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .


      - name: Check version single-source-of-truth (in container)
        run: |
          set -euo pipefail

          # Diagnostics (informational only).
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            hephaestus-ci:local uv run python -c "import hephaestus; print('Installed __version__:', hephaestus.__version__)"

          # ENFORCEMENT: the tested checker asserts there is no
          # static [project].version, that version is in [project].dynamic,
          # that [tool.hatch.version].source == "vcs". Under `set -e` a non-zero exit fails the
          # job — this is the live exit-1 path the old dead VERSION-file
          # branch never provided.
          #
          # Invoked as an installed module (-m) rather than the scripts/ shim:
          # the module form is immune to sys.path[0]/CWD-dependent __file__
          # resolution, so the checker's get_repo_root() anchors to the
          # installed package and reads the checked-out pyproject.toml.
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 \
            hephaestus-ci:local uv run python -m hephaestus.scripts_lib.check_version_single_source

      - name: Check uv.lock is in sync with pyproject.toml (in container)
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv lock --check

  license-scan:
    name: license-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes-gate
    if: needs.changes-gate.outputs.code_event == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs needs full history to compute the version

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hephaestus-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-hephaestus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      # Install the package + all runtime extras. ``[all]`` is required so
      # distributed_requirements() can read every runtime extra's Requires-Dist.

      - name: Run license scan (in container)
        id: license-scan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: >
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000
          -e GITHUB_EVENT_NAME
          hephaestus-ci:local uv run python scripts/check_license_compatibility.py

      - name: Post license-scan summary
        if: always()
        env:
          LICENSE_OUTCOME: ${{ steps.license-scan.outcome }}
        run: |
          {
            echo "## License Compatibility Scan"
            echo ""
            if [ "$LICENSE_OUTCOME" = "success" ]; then
              echo "All distributed dependency licenses compatible with BSD-3-Clause (see NOTICE)."
            else
              echo "Non-compatible license or coverage gap detected — see job logs and NOTICE."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # required-checks-gate is an aggregate workflow-level signal and a classic
  # branch-protection context, alongside the repository ruleset's direct
  # required contexts. It fans in every gating job above so the full workflow
  # has one auditable result; add every new gating job to `needs:`. Update the
  # GitHub ruleset deliberately only when that job also needs its own direct
  # ruleset context. See docs/ci/required-checks.md.
  #
  # `if: always()` is mandatory so an upstream job failure becomes one durable
  # aggregate result. The step below accepts a skipped dependency only for a
  # legitimately conditional job; this workflow's trigger never creates
  # skipped heavy-job contexts from a label or auto-merge event.
  required-checks-gate:
    name: required-checks-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs:
      - changes-gate
      - forbid-suppressions
      - lint
      - uv-lock-check
      - justfile-check
      - symlink-check
      - shellcheck
      - pr-policy
      - unit-tests
      - integration-tests
      - installed-cli-tests
      - shell-tests
      - build
      - security-dependency-scan
      - security-secrets-scan
      - security-sast-scan
      - security-workflow-scan
      - schema-validation
      - deps-version-sync
      - license-scan
    steps:
      - name: Verify no required job failed or was cancelled
        env:
          # `needs` is a GitHub-controlled object; passed via env and parsed by
          # the stdlib json module — never interpolated into the shell, so this
          # is injection-safe.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | python3 -c '
          import json
          import sys

          needs = json.load(sys.stdin)
          bad = {
              name: outcome["result"]
              for name, outcome in needs.items()
              if outcome["result"] not in ("success", "skipped")
          }
          if bad:
              print("Required jobs not green:", json.dumps(bad, sort_keys=True))
              sys.exit(1)
          print("All required jobs green or legitimately skipped.")
          '
