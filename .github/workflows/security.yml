name: Security

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "NOTICE"
      - "**/*.py"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Read-only scans — safe to cancel. Collapse successive pushes to the same PR
# branch (head_ref) so only the latest scan runs; schedule/dispatch fall back to
# github.ref for a stable per-ref group.
concurrency:
  group: security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Dependency vulnerability scan
    # PR-time pip-audit runs in _required.yml (security/dependency-scan). Skip
    # here on PRs to avoid the ~2x duplicate run; still runs on the weekly
    # schedule + manual dispatch. See issue #1182.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.2.0
        with:
          path: ~/.local/share/containers/storage
          key: hephaestus-podman-${{ runner.os }}-${{ hashFiles('ci/Containerfile', 'uv.lock', 'pyproject.toml') }}
          restore-keys: |
            hephaestus-podman-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Run pip-audit (in container)
        id: pip-audit
        run: podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 hephaestus-ci:local uv run pip-audit

      - name: Post pip-audit summary
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.pip-audit.outcome }}
        run: |
          {
            echo "## pip-audit Security Scan"
            echo ""
            if [ "$AUDIT_OUTCOME" = "success" ]; then
              echo "No HIGH/CRITICAL vulnerabilities found."
            else
              echo "Vulnerabilities detected — see job logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: Static Application Security Testing
    # PR-time SAST runs in _required.yml (security/sast-scan). Skip here on PRs
    # to avoid the ~2x duplicate run; still runs on the weekly schedule +
    # manual dispatch. See issue #1182.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.2.0
        with:
          path: ~/.local/share/containers/storage
          key: hephaestus-podman-${{ runner.os }}-${{ hashFiles('ci/Containerfile', 'uv.lock', 'pyproject.toml') }}
          restore-keys: |
            hephaestus-podman-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Run bandit (SAST, in container)
        id: bandit
        run: podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 hephaestus-ci:local uv run bandit -c pyproject.toml -r hephaestus scripts --severity-level medium

      - name: Run bandit LOW-severity baseline check (in container)
        id: bandit-low
        run: |
          mkdir -p build
          podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 hephaestus-ci:local bash -c '
            uv run bandit -c pyproject.toml -r hephaestus scripts --severity-level low --exit-zero -f json -o /workspace/build/bandit_low.json
            uv run python /workspace/hephaestus/ci/bandit_baseline_check.py /workspace/build/bandit_low.json /workspace/hephaestus/ci/bandit_low_baseline.json
          '

      - name: Post bandit summary
        if: always()
        env:
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          BANDIT_LOW_OUTCOME: ${{ steps.bandit-low.outcome }}
        run: |
          {
            echo "## Bandit Static Application Security Testing"
            echo ""
            if [ "$BANDIT_OUTCOME" != "success" ]; then
              echo "Medium-or-higher security findings detected — see job logs."
            elif [ "$BANDIT_LOW_OUTCOME" != "success" ]; then
              echo "LOW-severity baseline mismatch detected — see job logs."
            else
              echo "No unreviewed security findings or baseline drift detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-scan:
    name: GitHub Actions workflow and composite-action security scan
    # PR-time scan runs in _required.yml (security/workflow-scan). This weekly
    # run additionally enables the online, API-backed audits (e.g.
    # known-vulnerable-actions) that the offline PR gate cannot perform.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.2.0
        with:
          path: ~/.local/share/containers/storage
          key: hephaestus-podman-${{ runner.os }}-${{ hashFiles('ci/Containerfile', 'uv.lock', 'pyproject.toml') }}
          restore-keys: |
            hephaestus-podman-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Run zizmor (GitHub Actions SAST with online audits, in container)
        id: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 -e GH_TOKEN hephaestus-ci:local uv run zizmor --min-severity medium .github/workflows/ .github/actions/

      - name: Post zizmor summary
        if: always()
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          {
            echo "## zizmor GitHub Actions SAST"
            echo ""
            if [ "$ZIZMOR_OUTCOME" = "success" ]; then
              echo "No workflow or composite-action findings at medium+ severity."
            else
              echo "GitHub Actions security findings detected — see job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  license-scan:
    name: License compatibility scan
    # PR-time license-scan runs in _required.yml (license-scan, gated via
    # required-checks-gate). Skip here on PRs to avoid the ~2x duplicate run;
    # still runs on the weekly schedule + manual dispatch. See issue #1514.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs needs full history to compute the version
          persist-credentials: false

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.2.0
        with:
          path: ~/.local/share/containers/storage
          key: hephaestus-podman-${{ runner.os }}-${{ hashFiles('ci/Containerfile', 'uv.lock', 'pyproject.toml') }}
          restore-keys: |
            hephaestus-podman-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t hephaestus-ci:local .

      - name: Run license scan (in container)
        id: license-scan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: podman run --rm --tmpfs /tmp:rw,size=4g,mode=1777 -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 hephaestus-ci:local uv run python scripts/check_license_compatibility.py

      - name: Post license-scan summary
        if: always()
        env:
          LICENSE_OUTCOME: ${{ steps.license-scan.outcome }}
        run: |
          {
            echo "## License Compatibility Scan"
            echo ""
            if [ "$LICENSE_OUTCOME" = "success" ]; then
              echo "All distributed dependency licenses compatible with BSD-3-Clause (see NOTICE)."
            else
              echo "Non-compatible license or coverage gap detected — see job logs and NOTICE."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
