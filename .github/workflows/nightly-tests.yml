name: Nightly Tests

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read  # Pull the shared CI image

jobs:
  # The retained governance check (issue #2853). The protected signed tag
  # agent-contract-v1.0.0 and its immutable release pin this external
  # provider; retargeting the tag is the operator-visible update path (see
  # SECURITY.md). A full-length commit SHA is not applicable to the
  # tag-based released contract.
  agent-contract:
    uses: HomericIntelligence/Athena/.github/workflows/_agent-contract.yml@agent-contract-v1.0.0  # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
  ci-image:
    name: ci-image
    uses: ./.github/workflows/publish-ci-image.yml
    permissions:
      contents: read
      packages: write  # Push the image the container jobs pull

  unit-coverage:
    name: Full unit coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: "1.36.0"
      - name: Run full unit coverage
        # Nightly is the only lane that still runs the nightly-marked
        # high-cost tests, so it must keep them. Run in parallel; the suite
        # takes roughly 33 minutes serially.
        run: >
          uv run pytest tests/unit --override-ini="addopts=" -v --strict-markers
          -m "not performance and not contract"
          -n 2
          --cov=hephaestus --cov-report=term-missing --cov-report=xml
      - name: Check per-module coverage floors
        run: uv run hephaestus-check-coverage --coverage-file coverage.xml --config coverage.toml
      - name: Persist coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-unit-coverage
          path: coverage.xml
          retention-days: 14

  functional-tests:
    name: Remaining functional tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked
      - name: Install Pi CLI
        uses: ./.github/actions/setup-pi-cli
      - name: Run remaining functional tests
        run: >
          uv run pytest tests/integration --require-pi-package-smoke
          --override-ini="addopts=" -v --strict-markers
          -m "not precommit and not performance and not contract and not artifact and not codex_release_artifact"

  pi-conformance:
    name: Pi conformance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked
      - name: Install managed Pi runtime
        uses: ./.github/actions/setup-pi-cli
      - name: Run Pi conformance tests
        run: uv run pytest tests/integration/test_pi_plugin_package_smoke.py tests/unit/agents/test_pi_plugins.py tests/unit/agents/test_pi_skill_confinement.py tests/unit/agents/test_pi_session.py tests/unit/agents/test_pi_alias_config.py tests/unit/ci/test_workflows.py --override-ini="addopts=" -v --strict-markers --require-pi-package-smoke

  installed-cli-tests:
    name: Installed CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel into fresh environment
        run: |
          uv venv build/cli-venv
          WHEEL=(dist/*.whl)
          uv pip install --python build/cli-venv/bin/python "${WHEEL[0]}[automation]" pytest pyyaml
      - name: Run installed CLI tests
        run: |
          export PATH="$PWD/build/cli-venv/bin:$PATH"
          build/cli-venv/bin/pytest tests/integration/test_cli_entry_points.py --require-cli --override-ini="addopts=" -v --strict-markers

  build:
    name: Artifact and package tests
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked
      - name: Provision Codex Sigstore fixture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/provision_codex_sigstore_fixture.py --root "$PWD/build/test-fixtures/codex-sigstore/rust-v0.153.4"
      - name: Prepare the shared CI image
        uses: ./.github/actions/setup-ci-image
        with:
          image: ${{ needs.ci-image.outputs.image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate offline Codex artifacts
        run: >
          podman run --rm --network=none --tmpfs /tmp:rw,size=4g,mode=1777
          -v "$PWD:/workspace:Z"
          -v "$PWD/build/test-fixtures/codex-sigstore/rust-v0.153.4:/codex-sigstore/rust-v0.153.4:ro"
          -v "$PWD/build/test-fixtures/codex-sigstore/rust-v0.153.4:/workspace/build/test-fixtures/codex-sigstore/rust-v0.153.4:ro"
          -e HEPHAESTUS_CODEX_SIGSTORE_FIXTURE_ROOT=/codex-sigstore/rust-v0.153.4
          -e UV_NO_SYNC=1 -e PYTHONPATH=/workspace
          --userns=keep-id:uid=1000,gid=1000
          hephaestus-ci:local uv run pytest tests/integration
          --override-ini="addopts=" --basetemp=build/pytest-codex-artifacts
          -v --strict-markers -m codex_release_artifact

  nats-integration:
    name: NATS real-broker integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked
      - name: Install pinned nats-server
        uses: ./.github/actions/setup-nats-server
      - name: Run NATS durable-failure integration tests
        env:
          HEPHAESTUS_REQUIRE_NATS_SERVER: "1"
        run: >
          uv run pytest tests/integration/nats
          --override-ini="addopts="
          --basetemp=build/pytest-nats -v --strict-markers

  notify-failure:
    name: Open or update failure tracking issue
    needs:
      - agent-contract
      - ci-image
      - unit-coverage
      - functional-tests
      - pi-conformance
      - installed-cli-tests
      - build
      - nats-integration
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          title="[scheduled-ci] ${WORKFLOW_NAME} failed on ${BRANCH}"
          notice="_Automated notification from the scheduled \`${WORKFLOW_NAME}\` workflow._"
          body="$(printf 'Scheduled lane `%s` failed on branch `%s`.\nRun: %s\n\n%s' "$WORKFLOW_NAME" "$BRANCH" "$RUN_URL" "$notice")"
          existing="$(gh issue list --repo "${REPOSITORY}" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${REPOSITORY}" --body "Failed again — run: ${RUN_URL}"
          else
            gh issue create --repo "${REPOSITORY}" --title "$title" --body "$body"
          fi
