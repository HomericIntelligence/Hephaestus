name: PR 3160 macOS Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr3160-macos-evidence-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-production-receipt:
    name: Production host receipt at d9dafc1b
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: d9dafc1b607d247e6c6227804093f53a482e4eef
          path: candidate
      - name: Verify the candidate and production receipt
        env:
          EXPECTED_COMMAND: >-
            uv run pytest -o addopts= tests/unit/automation/pipeline/test_worker_pool.py::TestHostVerificationGitExecPath tests/unit/automation/pipeline/test_worker_pool.py::TestWorkerPoolSubmitComplete::test_immutable_trusted_runner_preserves_native_fallback tests/unit/automation/pipeline/test_worker_pool.py::TestWorkerPoolSubmitComplete::test_immutable_changed_runner_rejects_native_fallback tests/unit/automation/pipeline/test_worker_pool.py::TestWorkerPoolSubmitComplete::test_immutable_changed_helper_rejects_native_fallback -q --tb=short
          EXPECTED_HEAD: d9dafc1b607d247e6c6227804093f53a482e4eef
          RECEIPT: build/review-evidence/pr3160-macos-focused-d9dafc1b.txt
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git -C candidate status --short)"
          grep -Fqx "head_before: $EXPECTED_HEAD" "$RECEIPT"
          grep -Fqx "head_after: $EXPECTED_HEAD" "$RECEIPT"
          grep -Fqx "status_before:" "$RECEIPT"
          grep -Fqx "status_after:" "$RECEIPT"
          grep -Fqx "exit_status: 0" "$RECEIPT"
          grep -Fqx "exact_command: $EXPECTED_COMMAND" "$RECEIPT"
          grep -Fqx "24 passed in 15.56s" "$RECEIPT"
      - name: Upload the production host receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr3160-macos-focused-d9dafc1b
          path: build/review-evidence/pr3160-macos-focused-d9dafc1b.txt
          if-no-files-found: error
          retention-days: 14
