name: PR 3171 macOS Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr3171-macos-evidence-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-exact-head:
    name: Darwin fixture at 61db8329
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 61db8329ae4c102d95763811f81451b27789c6a8
          path: candidate
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the locked environment and Markdown linter
        working-directory: candidate
        run: |
          uv sync --all-groups --all-extras --locked
          npm install --global markdownlint-cli2@0.20.0
      - name: Run the exact Darwin fixture tests
        env:
          EXPECTED_HEAD: 61db8329ae4c102d95763811f81451b27789c6a8
          EXACT_COMMAND: >-
            uv run pytest -o addopts= tests/integration/test_mnemosyne_validator_offline.py -q --tb=short
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"
          set +e
          output=$(uv run pytest -o addopts= tests/integration/test_mnemosyne_validator_offline.py -q --tb=short 2>&1)
          status=$?
          set -e
          {
            echo "head_before: $EXPECTED_HEAD"
            echo "exact_command: $EXACT_COMMAND"
            echo "$output"
            echo "exit_status: $status"
            echo "head_after: $(git rev-parse HEAD)"
            echo "status_after: $(git status --short)"
          } | tee ../pr3171-macos-61db8329.txt
          test "$status" -eq 0
          grep -Eq '2 passed' ../pr3171-macos-61db8329.txt
          if grep -Eq '[0-9]+ skipped' ../pr3171-macos-61db8329.txt; then
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"
      - name: Upload the exact-head receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr3171-macos-61db8329
          path: pr3171-macos-61db8329.txt
          if-no-files-found: error
          retention-days: 14
