[project]
name = "comet"
version = "0.1.0"
description = "Per-cluster shared inference service and data-gen infra for LLM360 (mid5 sprint)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "David Bellamy" }, { name = "Micah Villmow" }]
# 3.12, not latest: matches the interpreter proven out on M1/M2 cluster deployments
# (mermaid-code precedent) and everything that runs there is installed from this
# one lock, so gateway/registrar/supervisor jobs can never mix interpreters.
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "grpcio>=1.81.0",
    "grpcio-health-checking>=1.81.0",
    "pyyaml>=6.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "uvloop>=0.21",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
aws = ["boto3>=1.43.78"]
stage = ["huggingface_hub[hf_transfer]>=1.28.0"]
dev = [
    "huggingface_hub==1.28.0",
    "ruff>=0.15",
    "ty>=0.0.1a1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "jsonschema>=4.23",
    "pre-commit>=4",
    "mkdocs-material>=9.6,<10",
    "pymdown-extensions>=10.14,<11",
]

[project.scripts]
comet = "comet.cli.main:app"
comet-admin = "comet.cli.admin:app"
comet-proxy = "comet.proxy.app:main"
comet-runner = "comet.runner.main:main"
comet-ingest = "comet.ingest.app:main"
comet-dashboard = "comet.dashboard.web:main"
comet-alerts = "comet.alerts:main"
comet-dataset = "comet.registry.cli:main"
comet-gpu-monitor = "comet.gpu_monitor:main"
comet-port-lease-run = "comet.port_lease:main"
comet-gateway-monitor = "comet.gateway_monitor:main"
comet-gateway-front = "comet.gateway_front:main"
comet-fair-share-shadow = "comet.fair_share.shadow:main"
comet-fair-share-service = "comet.fair_share.service:main"
comet-fair-share-target = "comet.fair_share.service:target_main"
comet-fair-share-retire = "comet.fair_share.service:retire_main"
comet-operator = "comet.cli.operator:app"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.12.7"

[tool.hatch.build.targets.wheel]
packages = ["src/comet"]

[tool.hatch.build.targets.wheel.force-include]
"clusters" = "comet/data/clusters"
"cookbooks" = "comet/data/cookbooks"
"deployment/contexts" = "comet/data/deployment/contexts"
"deployment/k2-horizon" = "comet/data/deployment/k2-horizon"
"deployment/qualification-acceptances" = "comet/data/deployment/qualification-acceptances"
"deployment/source-admissions" = "comet/data/deployment/source-admissions"
"migrations" = "comet/data/migrations"
"schema/deployment-context.schema.json" = "comet/data/schema/deployment-context.schema.json"

# ---------------------------------------------------------------------------
# Lint + format: ruff (Astral). This file is the SOURCE OF TRUTH for code
# standards; CONTRIBUTING.md narrates it but never restates the rules.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, N naming, W warnings, UP pyupgrade,
# B bugbear, SIM simplify, C4 comprehensions, PIE, RET returns, RUF ruff,
# PT pytest, TCH type-checking blocks, PTH use-pathlib, D docstrings.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF", "PT", "TCH", "PTH", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Pydantic model annotations are evaluated at runtime; never move them into
# TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "comet.release._base._ReleaseModel"]

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings.
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# Type checking: ty (Astral).
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"
# tests/test_schema_export.py imports from scripts/ via a sys.path insert.
extra-paths = ["scripts"]

[tool.ty.src]
include = ["src", "tests"]

# ---------------------------------------------------------------------------
# Tests: pytest. --strict-markers/--strict-config fail on typos in markers or
# config rather than silently ignoring them.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: real PostgreSQL 17 integration tests (requires the pinned TLS test service)",
    "postgres_quick: bounded PostgreSQL integration coverage for CI",
]
