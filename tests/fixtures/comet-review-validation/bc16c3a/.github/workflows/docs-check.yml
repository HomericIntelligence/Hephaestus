name: docs-check

on:
  workflow_call:
    inputs:
      run_strict_build:
        description: Run the strict documentation build
        required: true
        type: boolean
      upload_site:
        description: Upload the built site for deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: docs-strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build site in strict mode
        if: inputs.run_strict_build
        run: uv run --locked --extra dev mkdocs build --strict
      - name: Successful no-op
        if: ${{ !inputs.run_strict_build }}
        run: echo "Documentation check is not applicable to this change."
      - name: Upload site for Cloudflare Workers
        if: inputs.run_strict_build && inputs.upload_site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comet-docs-site
          path: site
          if-no-files-found: error
      - name: Upload site for GitHub Pages
        if: inputs.run_strict_build && inputs.upload_site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
