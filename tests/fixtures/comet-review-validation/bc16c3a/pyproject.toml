[project]
name = "comet"
version = "0.1.0"
description = "Per-cluster shared inference service and data-gen infra for LLM360 (mid5 sprint)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "David Bellamy" }, { name = "Micah Villmow" }]
# 3.12, not latest: matches the interpreter proven out on M1/M2 cluster deployments
# (mermaid-code precedent) and everything that runs there is installed from this
# one lock, so gateway/registrar/supervisor jobs can never mix interpreters.
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.27.3",
    "pydantic>=2.14.1",
    "jinja2>=3.1",
    "httpx>=0.27",
    "grpcio>=1.84.1",
    "grpcio-health-checking>=1.84.1",
    "pyyaml>=6.0",
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "asyncpg>=0.32.0",
    "tokenizers>=0.23,<0.24",
]

[project.optional-dependencies]
aws = ["boto3>=1.43.118"]
stage = ["huggingface_hub[hf_transfer]>=2.2.0"]
dev = [
    "huggingface_hub==2.2.0",
    "ruff>=0.17.2",
    "ty>=0.0.91,<0.0.92",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=2.4",
    "jsonschema>=4.23",
    "pre-commit>=4.7.0",
    "mkdocs-material>=9.6,<10",
    "pymdown-extensions>=12.3,<13",
]
reports = [
    "markdown>=3.11.2",
    "matplotlib>=3.10",
    "openai>=3.37.0",
    "weasyprint>=66",
]

[project.scripts]
comet = "comet.cli.main:app"
comet-admin = "comet.cli.admin:app"
comet-service = "comet.cli.service:app"
comet-control-plane = "comet.cli.control_plane:app"
comet-proxy = "comet.proxy.app:main"
comet-runner = "comet.runner.main:main"
comet-ingest = "comet.ingest.app:main"
comet-dashboard = "comet.dashboard.web:main"
comet-alerts = "comet.alerts:main"
comet-dataset = "comet.registry.cli:main"
comet-gpu-monitor = "comet.gpu_monitor:main"
comet-port-lease-run = "comet.port_lease:main"
comet-gateway-monitor = "comet.gateway_monitor:main"
comet-gateway-front = "comet.gateway_front:main"
comet-fair-share-shadow = "comet.fair_share.shadow:main"
comet-fair-share-service = "comet.fair_share.service:main"
comet-fair-share-target = "comet.fair_share.service:target_main"
comet-fair-share-retire = "comet.fair_share.service:retire_main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.10.8"

[tool.hatch.build.targets.wheel]
packages = ["src/comet"]

[tool.hatch.build.targets.wheel.force-include]
"clusters" = "comet/data/clusters"
"cookbooks" = "comet/data/cookbooks"
"deployment/contexts" = "comet/data/deployment/contexts"
"deployment/k2-horizon" = "comet/data/deployment/k2-horizon"
"deployment/qualification-acceptances" = "comet/data/deployment/qualification-acceptances"
"deployment/source-admissions" = "comet/data/deployment/source-admissions"
"migrations" = "comet/data/migrations"
"qualifications/kimi-k3-kv-cache/suites" = "comet/data/qualifications/kimi-k3-kv-cache/suites"
"schema/deployment-context.schema.json" = "comet/data/schema/deployment-context.schema.json"

# ---------------------------------------------------------------------------
# Lint + format: ruff (Astral). This file is the SOURCE OF TRUTH for code
# standards; CONTRIBUTING.md narrates it but never restates the rules.
# ---------------------------------------------------------------------------
[tool.ruff]
# The deployment-input policy governs K2 planning records under plans/.
# A formatter must not rewrite them, because that moves the change into
# the affected route, which needs its own admitted identity.
extend-exclude = ["plans"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, N naming, W warnings, UP pyupgrade,
# B bugbear, SIM simplify, C4 comprehensions, PIE, RET returns, RUF ruff,
# PT pytest, TCH type-checking blocks, PTH use-pathlib, D docstrings.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF", "PT", "TCH", "PTH", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
# Error descriptions are not product contracts.
raises-require-match-for = []

[tool.ruff.lint.flake8-type-checking]
# Pydantic model annotations are evaluated at runtime; never move them into
# TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "comet.release._base._ReleaseModel"]

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings.
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# Type checking: ty (Astral).
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"
# Tests import the repository script modules.
extra-paths = ["scripts", "scripts/dev", "docs/reports/scripts"]

[tool.ty.src]
include = ["src", "tests"]

# ty 0.0.91 reports the typeshed `contextmanager`/`asynccontextmanager`
# overload that takes a `-> Iterator[Foo]` annotation as deprecated, and the
# repository uses that annotation throughout (135 context managers). Silence
# only that rule so the warning gate keeps failing on every other diagnostic.
# Moving to `-> Generator[Foo]` is a repo-wide sweep, tracked separately.
[tool.ty.rules]
deprecated = "ignore"

# ---------------------------------------------------------------------------
# Tests: pytest. --strict-markers/--strict-config fail on typos in markers or
# config rather than silently ignoring them.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: real PostgreSQL 17 integration tests (requires the pinned TLS test service)",
    "postgres_quick: bounded PostgreSQL integration coverage for CI",
    "gateway_models(*ids): model ids the stub gateway serves in agent setup-script installer tests",
    "linux_only: test needs Linux-only primitives (/usr/bin/bwrap, sudo, process groups, or the pinned system Python)",
    "conformance: real-identity multi-instance boundary suite (requires scripts/run-conformance.sh)",
    "no_principal_gate: conformance self-test that runs without the real-identity setup gate",
]
