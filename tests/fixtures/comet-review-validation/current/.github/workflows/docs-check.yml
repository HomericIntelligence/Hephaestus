name: docs-check

on:
  workflow_call:
    inputs:
      run_strict_build:
        description: Run the strict documentation build
        required: true
        type: boolean
      upload_site:
        description: Upload the built site for deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: docs-strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build site in strict mode
        if: inputs.run_strict_build
        run: uv run --locked --extra dev mkdocs build --strict
      - name: Successful no-op
        if: ${{ !inputs.run_strict_build }}
        run: echo "Documentation check is not applicable to this change."
      - name: Upload site for Cloudflare Workers
        if: inputs.run_strict_build && inputs.upload_site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comet-docs-site
          path: site
          if-no-files-found: error
      - name: Upload site for GitHub Pages
        if: inputs.run_strict_build && inputs.upload_site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
