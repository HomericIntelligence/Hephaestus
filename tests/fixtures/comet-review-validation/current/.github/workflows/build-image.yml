name: artifacts

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON matrix of selected artifact validators
        required: true
        type: string
  push:
    branches: [main, prod]
    paths:
      - docker/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - docker/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-image.yml

permissions:
  contents: read

jobs:
  validate:
    if: inputs.matrix != ''
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Successful no-op
        if: matrix.id == 'noop'
        run: echo "No artifact validator applies to this change."
      - name: Confirm Docker
        if: matrix.engine == 'docker'
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          test "$(id -u)" -ne 0
          docker info >/dev/null
      - name: Confirm rootless Podman
        if: matrix.engine == 'podman'
        shell: bash
        run: |
          set -euo pipefail
          command -v podman
          test "$(id -u)" -ne 0
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"
      - name: Validate selected artifact
        if: matrix.id != 'noop'
        env:
          CONTAINER_ENGINE: ${{ matrix.engine }}
          VALIDATOR: ${{ matrix.id }}
        run: >-
          uv run --locked --extra dev python scripts/check_deployed_inputs.py validate
          --validator "${VALIDATOR}"
          --container-engine "${CONTAINER_ENGINE}"

  build:
    if: inputs.matrix == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3
      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          platforms: linux/amd64
          tags: comet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
