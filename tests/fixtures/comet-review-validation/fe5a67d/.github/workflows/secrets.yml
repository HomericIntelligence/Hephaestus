name: secrets

# Run the full-history secret scan as one reusable CI gate. The
# gitleaks-action wrapper requires a paid license for organization
# repositories. The Gitleaks binary does not require that license.
on:
  workflow_call:
  push:
    branches: [main, prod]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run gitleaks over full git history
        run: scripts/ci/run-gitleaks.sh
