                          os.close(descriptor)
                      raise SystemExit("root namespace record creation is malformed") from error
                  if result.stdout != (
                      json.dumps(created, separators=(",", ":"), sort_keys=True) + "\n"
                  ).encode("utf-8") or created != {
                      "control": f"comet-root-{phase_name}-control.{token}",
                      "status": f"comet-root-{phase_name}-status.{token}",
                  }:
                      for descriptor in descriptors:
                          os.close(descriptor)
                      raise SystemExit("root namespace record creation is invalid")
                  control_directory = execution_directory / created["control"]
                  status_directory = execution_directory / created["status"]
                  (
                      control_directory_descriptor,
                      control_descriptor,
                      status_directory_descriptor,
                      status_descriptor,
                  ) = descriptors
                  records_by_phase[phase_name] = {
                      "control_directory": control_directory,
                      "control_directory_descriptor": control_directory_descriptor,
                      "control_descriptor": control_descriptor,
                      "control_path": control_directory / "request",
                      "status_directory": status_directory,
                      "status_directory_descriptor": status_directory_descriptor,
                      "status_descriptor": status_descriptor,
                      "status_path": status_directory / "result.json",
                  }
              return records_by_phase

          phase_records = create_phase_records()

          def verify_phase_records(
              phase_name: str, *, expect_status: bool, expected_request: bytes | None = None,
              allow_missing_status: bool = False, control_only: bool = False,
              deadline: float | None = None,
          ) -> tuple[bytes, bytes]:
              records = phase_records[phase_name]
              verify_policy_inputs()
              snapshot = root_phase_snapshot(
                  records, control_only=control_only, deadline=deadline
              )
              expected_labels = {"control"} if control_only else {"control", "status"}
              if set(snapshot) != expected_labels:
                  raise SystemExit("root namespace record inspection is incomplete")
              selected_records = (
                  ("control", "control_directory_descriptor", "control_descriptor"),
                  ("status", "status_directory_descriptor", "status_descriptor"),
              )
              if control_only:
                  selected_records = selected_records[:1]
              for label, directory_key, file_key in selected_records:
                  directory_status = os.fstat(records[directory_key])
                  file_status = os.fstat(records[file_key])
                  if (
                      not stat.S_ISDIR(directory_status.st_mode)
                      or directory_status.st_uid != 0 or directory_status.st_gid != 0
                      or stat.S_IMODE(directory_status.st_mode) != 0o700
                      or not stat.S_ISREG(file_status.st_mode)
                      or file_status.st_uid != 0 or file_status.st_gid != 0
                      or stat.S_IMODE(file_status.st_mode) != 0o600 or file_status.st_nlink != 1
                      or snapshot[label]["directory"] != [
                          directory_status.st_dev,
                          directory_status.st_ino,
                          directory_status.st_mode,
                          directory_status.st_uid,
                          directory_status.st_gid,
                      ]
                      or snapshot[label]["file"] != [
                          file_status.st_dev,
                          file_status.st_ino,
                          file_status.st_mode,
                          file_status.st_uid,
                          file_status.st_gid,
                          file_status.st_nlink,
                          file_status.st_size,
                      ]
                  ):
                      raise SystemExit("root namespace record identity is invalid")
              request_data = os.pread(records["control_descriptor"], 2, 0)
              if bytes.fromhex(snapshot["control"]["data"]) != request_data:
                  raise SystemExit("root namespace control record changed")
              if request_data not in (b"0", b"1"):
                  raise SystemExit("root namespace control record is invalid")
              if expected_request is not None and request_data != expected_request:
                  raise SystemExit("root namespace control request is unexpected")
              if control_only:
                  return request_data, b""
              status_size = os.fstat(records["status_descriptor"]).st_size
              status_data = os.pread(records["status_descriptor"], 257, 0)
              if bytes.fromhex(snapshot["status"]["data"]) != status_data:
                  raise SystemExit("root namespace status record changed")
              if expect_status and not 0 < status_size <= 256:
                  if not (allow_missing_status and status_size == 0):
                      raise SystemExit("root namespace status record is invalid")
              if not expect_status and status_size != 0:
                  raise SystemExit("root namespace status record is not empty")
              return request_data, status_data

          def read_phase_status(
              phase_name: str,
              *,
              allow_missing_status: bool = False,
              deadline: float | None = None,
          ) -> dict[str, object] | None:
              def decode_status(data: bytes) -> dict[str, object]:
                  try:
                      value = json.loads(data)
                  except (UnicodeDecodeError, json.JSONDecodeError) as error:
                      raise SystemExit("root namespace status record is malformed") from error
                  if (
                      not 0 < len(data) <= 256
                      or data
                      != (
                          json.dumps(value, separators=(",", ":"), sort_keys=True) + "\n"
                      ).encode("utf-8")
                      or set(value) != {"cleanup", "schema", "selected_exit_status"}
                      or type(value["schema"]) is not int
                      or value["schema"] != 1
                      or value["cleanup"]
                      not in {
                          "clean",
                          "descendant_terminated",
                          "descendant_survived",
                          "inspection_failed",
                      }
                      or type(value["selected_exit_status"]) is not int
                      or isinstance(value["selected_exit_status"], bool)
                      or not -64 <= value["selected_exit_status"] <= 255
                  ):
                      raise SystemExit("root namespace status record is inconsistent")
                  return value

              _request_data, data = verify_phase_records(
                  phase_name,
                  expect_status=True,
                  allow_missing_status=allow_missing_status,
                  deadline=deadline,
              )
              if not data and allow_missing_status:
                  _request_data, data = verify_phase_records(
                      phase_name,
                      expect_status=True,
                      allow_missing_status=True,
                      deadline=deadline,
                  )
              if not data:
                  return None
              value = decode_status(data)
              _request_data, stable_data = verify_phase_records(
                  phase_name,
                  expect_status=True,
                  deadline=deadline,
              )
              if stable_data != data:
                  decode_status(stable_data)
                  raise SystemExit("root namespace status record changed")
              return value
          run_isolation_command(
              [
                  str(trusted_chown),
                  "--no-dereference",
                  "--recursive",
                  f"{selected_uid}:{selected_gid}",
                  str(staged_source),
                  str(selected_directory),
              ]
          )
          run_isolation_command([str(trusted_chmod), "0755", str(selected_directory)])
          staged_source_binding = input_identity(staged_source, owner=selected_uid)
          selected_directory_opened = os.fstat(selected_directory_descriptor)
          if (
              not stat.S_ISDIR(selected_directory_opened.st_mode)
              or (selected_directory_opened.st_dev, selected_directory_opened.st_ino)
              != selected_directory_identity
              or selected_directory_opened.st_uid != selected_uid
              or selected_directory_opened.st_gid != selected_gid
              or stat.S_IMODE(selected_directory_opened.st_mode) != 0o755
          ):
              raise SystemExit("root test isolation parent directory is invalid")
          for writable_descriptor in writable_directory_descriptors.values():
              writable_status = os.fstat(writable_descriptor)
              if (
                  not stat.S_ISDIR(writable_status.st_mode)
                  or writable_status.st_uid != selected_uid
                  or writable_status.st_gid != selected_gid
                  or stat.S_IMODE(writable_status.st_mode) != 0o755
                  or os.listdir(writable_descriptor)
              ):
                  raise SystemExit("root writable source leaf is invalid")
          selected_named = os.fstat(selected_descriptor)
          if (
              not stat.S_ISDIR(selected_named.st_mode)
              or (selected_named.st_dev, selected_named.st_ino) != selected_identity
              or selected_named.st_uid != selected_uid
              or selected_named.st_gid != selected_gid
              or stat.S_IMODE(selected_named.st_mode) != 0o755
          ):
              raise SystemExit("root test isolation directory is invalid")

          junit = Path("/outputs/private/root-junit.xml")
          test_command = [
              "uv", "run", "--locked", "--extra", "dev", "python",
              "scripts/ci/run-test-tier.py", "promotion", "--",
              "--junitxml=<selected-private-directory>/root-junit.xml", "--durations=0",
          ]
          command = [
              "/tools/uv", "run", "--locked", "--extra", "dev",
              "--directory", "/workspace", "python",
              "/workspace/scripts/ci/run-test-tier.py", "promotion", "--",
              f"--junitxml={junit}", "--durations=0",
          ]
          selected_environment = {
              "HOME": "/outputs/home",
              "LANG": "C.UTF-8",
              "LC_ALL": "C.UTF-8",
              "LOGNAME": "nobody",
              "PATH": "/venv/bin:/tools:/usr/bin:/bin",
              "TMPDIR": "/tmp",
              "USER": "nobody",
              "UV_CACHE_DIR": "/uv-cache",
              "UV_PROJECT_ENVIRONMENT": "/venv",
              "UV_PYTHON": "/usr/bin/python3",
              "UV_PYTHON_DOWNLOADS": "never",
              "XDG_CACHE_HOME": "/outputs/home/.cache",
              "XDG_CONFIG_HOME": "/outputs/home/.config",
              "XDG_DATA_HOME": "/outputs/home/.local/share",
          }
          def namespace_command(
              *, preparation: bool, command_override: list[str] | None = None
          ) -> list[str]:
              phase_name = "prepare" if preparation else "final"
              records = phase_records[phase_name]
              verify_phase_records(phase_name, expect_status=False, expected_request=b"0")
              verify_policy_inputs()
              command_environment = dict(selected_environment)
              command_environment.update({"CI": "true", "GITHUB_ACTIONS": "true"})
              if preparation:
                  selected_command = [
                      "/bin/sh", "-ec",
                      "/tools/uv sync --locked --extra dev --directory /workspace; exec /venv/bin/python -I /policy/dependency-check.py",
                  ]
              else:
                  command_environment.update(
                      {
                          "NO_COLOR": "1",
                          "PYTHONPATH": "/workspace/src:/workspace",
                          "PYTEST_ADDOPTS": "-o cache_dir=/workspace/.pytest_cache",
                          "RUNNER_ARCH": os.environ.get("RUNNER_ARCH", "X64"),
                          "RUNNER_OS": "Linux",
                          "UV_NO_SYNC": "1",
                          "UV_OFFLINE": "1",
                      }
                  )
                  selected_command = command
              result = [
                  str(trusted_sudo), "--non-interactive", "--", str(trusted_bwrap),
                  "--unshare-pid", "--unshare-ipc", "--unshare-uts",
                  "--unshare-cgroup", "--die-with-parent", "--new-session", "--cap-drop", "ALL",
                  "--cap-add", "CAP_SETUID", "--cap-add", "CAP_SETGID", "--cap-add", "CAP_SETPCAP",
                  "--cap-add", "CAP_KILL", "--uid", "0", "--gid", "0", "--clearenv",
                  "--ro-bind", "/usr", "/usr", "--symlink", "usr/bin", "/bin",
                  "--symlink", "usr/lib", "/lib", "--symlink", "usr/lib64", "/lib64",
                  "--dev", "/dev", "--proc", "/proc", "--dir", "/dev/shm", "--tmpfs", "/dev/shm",
                  "--chmod", "1777", "/dev/shm", "--dir", "/etc", "--dir", "/etc/ssl", "--dir", "/policy",
                  "--dir", "/tools", "--dir", "/workspace", "--dir", "/outputs", "--dir", "/venv",
                  "--dir", "/uv-cache", "--dir", "/tmp",
                  "--ro-bind", str(namespace_etc / "passwd"), "/etc/passwd",
                  "--ro-bind", str(namespace_etc / "group"), "/etc/group",
                  "--ro-bind", str(namespace_etc / "hosts"), "/etc/hosts",
                  "--ro-bind", str(namespace_etc / "nsswitch.conf"), "/etc/nsswitch.conf",
                  "--ro-bind", str(supervisor), "/policy/namespace-supervisor.py",
                  "--ro-bind", str(selected_exec), "/policy/selected-exec.py",
                  "--ro-bind", str(dependency_check), "/policy/dependency-check.py",
                  "--bind", str(records["control_path"]), "/policy/termination-request",
                  "--bind", str(records["status_path"]), "/policy/result.json",
                  "--ro-bind", str(staged_uv), "/tools/uv",
                  "--ro-bind", str(staged_source), "/workspace",
                  "--bind", str(selected_result_directory), "/outputs/private",
                  "--bind", str(selected_home_directory if not preparation else selected_prepare_home_directory), "/outputs/home",
                  "--bind", str(selected_tmp_directory if not preparation else selected_prepare_tmp_directory), "/tmp",
              ]
              if Path("/etc/ssl").is_dir():
                  result.extend(["--ro-bind", "/etc/ssl", "/etc/ssl"])
              if Path("/etc/localtime").is_file():
                  result.extend(["--ro-bind", "/etc/localtime", "/etc/localtime"])
              if preparation:
                  for resolver in ("/etc/resolv.conf", "/etc/gai.conf"):
                      if Path(resolver).is_file():
                          result.extend(["--ro-bind", resolver, resolver])
                  result.extend(["--bind", str(selected_venv_directory), "/venv", "--bind", str(selected_cache_directory), "/uv-cache"])
              else:
                  result[4:4] = ["--unshare-net"]
                  result.extend(["--ro-bind", str(selected_venv_directory), "/venv", "--ro-bind", str(selected_cache_directory), "/uv-cache"])
                  result.extend(argument for destination, source in writable_directories.items() for argument in ("--bind", str(source), destination))
              result.extend(argument for name, value in sorted(command_environment.items()) for argument in ("--setenv", name, value))
              if command_override is not None:
                  selected_command = command_override
              result.extend([
                  "--chdir", "/workspace", str(trusted_python), "-I",
                  "/policy/namespace-supervisor.py", phase_name,
                  "/policy/termination-request", "/policy/result.json",
                  format(term_grace, ".17g"), json.dumps(selected_command, separators=(",", ":")),
              ])
              return result

          interrupted_signal = 0

          def handle_signal(signum: int, _frame: object) -> None:
              global interrupted_signal
              if not interrupted_signal:
                  interrupted_signal = signum

          def request_phase_termination(phase_name: str, *, deadline: float | None = None) -> bool:
              records = phase_records[phase_name]
              request_data, _status_data = verify_phase_records(
                  phase_name,
                  expect_status=False,
                  control_only=True,
                  deadline=deadline,
              )
              descriptor = records["control_descriptor"]
              if request_data == b"1":
                  return True
              if os.pwrite(descriptor, b"1", 0) != 1:
                  raise SystemExit("root namespace termination write is incomplete")
              os.fsync(descriptor)
              if os.pread(descriptor, 1, 0) != b"1":
                  raise SystemExit("root namespace termination request changed")
              verify_phase_records(
                  phase_name,
                  expect_status=False,
                  expected_request=b"1",
                  control_only=True,
                  deadline=deadline,
              )
              return True

          def process_snapshot(pid: int) -> tuple[tuple[int, int, int, int, int], str]:
              record = Path(f"/proc/{pid}/stat").read_text().rsplit(")", 1)
              if len(record) != 2:
                  raise ValueError
              fields = record[1].split()
              if len(fields) < 20:
                  raise ValueError
              identity = (pid, int(fields[19]), int(fields[1]), int(fields[2]), int(fields[3]))
              return identity, fields[0]

          def process_identity(pid: int) -> tuple[int, int, int, int, int]:
              return process_snapshot(pid)[0]

          handled_signals = (signal.SIGINT, signal.SIGTERM, signal.SIGHUP)
          previous_handlers = {
              signum: signal.signal(signum, handle_signal) for signum in handled_signals
          }
          preparation_command = namespace_command(preparation=True)
          preparation = subprocess.Popen(
              preparation_command, cwd="/", env=isolation_environment, stdin=subprocess.DEVNULL,
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True,
              umask=0o002,
          )
          preparation_requested = False
          preparation_pidfd = -1
          preparation_identity = (preparation.pid, 0, 0, 0, 0)
          preparation_adopted: dict[int, tuple[tuple[int, int, int, int, int], int]] = {}
          preparation_cleanup_failure = False

          def observe_preparation() -> bool:
              if preparation_pidfd < 0:
                  return preparation.poll() is not None
              return os.waitid(
                  os.P_PIDFD, preparation_pidfd, os.WEXITED | os.WNOHANG | os.WNOWAIT
              ) is not None

          def inspect_preparation_children() -> list[int]:
              live = []
              data = Path(f"/proc/self/task/{os.getpid()}/children").read_text(encoding="ascii")
              for child in (int(value) for value in data.split()):
                  if child == preparation.pid:
                      continue
                  if child not in preparation_adopted:
                      identity = process_identity(child)
                      descriptor = os.pidfd_open(child)
                      if identity[2] != os.getpid() or process_identity(child) != identity:
                          os.close(descriptor)
                          raise ValueError
                      preparation_adopted[child] = (identity, descriptor)
                  identity, descriptor = preparation_adopted[child]
                  if process_identity(child) != identity:
                      raise ValueError
                  if os.waitid(
                      os.P_PIDFD, descriptor, os.WEXITED | os.WNOHANG | os.WNOWAIT
                  ) is not None:
                      waited, _status = os.waitpid(child, os.WNOHANG)
                      if waited != child:
                          raise ValueError
                      os.close(descriptor)
                      del preparation_adopted[child]
                  else:
                      live.append(child)
              return live

          def emergency_stop_preparation() -> None:
              global preparation_cleanup_failure
              leader_group_proven = False
              if preparation_pidfd >= 0:
                  try:
                      leader_exited = os.waitid(
                          os.P_PIDFD,
                          preparation_pidfd,
                          os.WEXITED | os.WNOHANG | os.WNOWAIT,
                      ) is not None
                      if not leader_exited:
                          if (
                              preparation_identity[2:]
                              != (os.getpid(), preparation.pid, preparation.pid)
                              or process_identity(preparation.pid) != preparation_identity
                          ):
                              raise ValueError
                          leader_group_proven = True
                  except (OSError, ValueError, UnicodeError):
                      preparation_cleanup_failure = True
              else:
                  preparation_cleanup_failure = True
              if leader_group_proven:
                  try:
                      os.killpg(preparation.pid, signal.SIGKILL)
                  except (OSError, ProcessLookupError):
                      preparation_cleanup_failure = True
                  try:
                      signal.pidfd_send_signal(preparation_pidfd, signal.SIGKILL)
                  except OSError:
                      if os.waitid(
                          os.P_PIDFD,
                          preparation_pidfd,
                          os.WEXITED | os.WNOHANG | os.WNOWAIT,
                      ) is None:
                          preparation_cleanup_failure = True
              for identity, descriptor in tuple(preparation_adopted.values()):
                  try:
                      if process_identity(identity[0]) != identity:
                          raise ValueError
                      signal.pidfd_send_signal(descriptor, signal.SIGKILL)
                  except (OSError, ValueError, UnicodeError):
                      preparation_cleanup_failure = True

          while preparation.poll() is None:
              if interrupted_signal and not preparation_requested:
                  preparation_deadline = time.monotonic() + (2 * term_grace) + 1
                  normal_deadline = preparation_deadline - 1
                  preparation_pending = True
                  try:
                      preparation_pending = request_phase_termination(
                          "prepare", deadline=normal_deadline
                      )
                  except (OSError, ValueError, UnicodeError, subprocess.TimeoutExpired, TimeoutError):
                      preparation_cleanup_failure = True
                  if not preparation_pending:
                      break
                  preparation_requested = True
                  try:
                      preparation_pidfd = os.pidfd_open(preparation.pid)
                      preparation_identity = process_identity(preparation.pid)
                      if (
                          preparation_identity[2:]
                          != (os.getpid(), preparation.pid, preparation.pid)
                          or process_identity(preparation.pid) != preparation_identity
                      ):
                          raise ValueError
                  except (OSError, ValueError, UnicodeError):
                      preparation_cleanup_failure = True
                  cleanup_deadline = preparation_deadline
                  stable_empty = 0
                  emergency_sent = False
                  while time.monotonic() < cleanup_deadline:
                      try:
                          children = inspect_preparation_children()
                          exited = observe_preparation()
                          if exited and not children:
                              stable_empty += 1
                              if stable_empty >= 2:
                                  break
                          else:
                              stable_empty = 0
                          if time.monotonic() >= normal_deadline:
                              emergency_stop_preparation()
                              emergency_sent = True
                      except (OSError, ValueError, UnicodeError):
                          preparation_cleanup_failure = True
                      time.sleep(0.02)
                  try:
                      children = inspect_preparation_children()
                      if observe_preparation() and not children:
                          waited, status = os.waitpid(preparation.pid, os.WNOHANG)
                          if waited == preparation.pid:
                              preparation.returncode = os.waitstatus_to_exitcode(status)
                          else:
                              preparation_cleanup_failure = True
                      else:
                          preparation_cleanup_failure = True
                  except (OSError, ValueError, UnicodeError):
                      preparation_cleanup_failure = True
                  finally:
                      if preparation_pidfd >= 0:
                          os.close(preparation_pidfd)
                      for _identity, descriptor in preparation_adopted.values():
                          os.close(descriptor)
                  if preparation_cleanup_failure or preparation.returncode is None:
                      raise SystemExit("root dependency preparation cleanup did not complete")
                  if not emergency_sent and preparation.returncode is None:
                      raise SystemExit("root dependency preparation cleanup did not complete")
                  break
              time.sleep(0.02)
          preparation_return_code = preparation.wait()
          if interrupted_signal:
              raise SystemExit("an interrupt signal stopped root dependency preparation")
          verify_trusted_tools()
          verify_policy_inputs()
          if uv_identity() != trusted_uv_identity:
              raise SystemExit("root test uv executable changed after dependency preparation")
          if preparation_return_code != 0:
              raise SystemExit("root dependency preparation failed")
          preparation_status = read_phase_status("prepare")
          if preparation_status["cleanup"] != "clean" or preparation_status["selected_exit_status"] != 0:
              raise SystemExit("root dependency preparation cleanup failed")
          verify_tracked_source(source_directory)
          verify_tracked_source(staged_source)
          if execution_identity() != execution_binding:
              raise SystemExit("root execution directory changed after dependency preparation")
          if input_identity(staged_source, owner=selected_uid) != staged_source_binding:
              raise SystemExit("root execution source changed after dependency preparation")
          if input_identity(staged_bin) != staged_uv_binding:
              raise SystemExit("root execution uv input changed after dependency preparation")
          dependency_manifest = dependency_input_manifest()
          dependency_manifest_sha256 = hashlib.sha256(dependency_manifest).hexdigest()
          if dependency_input_manifest() != dependency_manifest:
              raise SystemExit("root dependency manifest changed before final execution")
          isolated_command = namespace_command(preparation=False)

          process = subprocess.Popen(
              isolated_command,
              cwd="/",
              env=isolation_environment,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              umask=0o002,
              start_new_session=True,
          )
          assert process.stdout is not None
          cleanup_state = "not_started"
          cleanup_failure: str | None = None
          escaped_descendant_observed = False

          def record_cleanup_failure(code: str) -> None:
              global cleanup_failure
              if cleanup_failure is None:
                  cleanup_failure = code

          leader_pidfd = -1
          leader_identity = (process.pid, 0, 0, 0, 0)
          try:
              leader_pidfd = os.pidfd_open(process.pid)
              leader_identity = process_identity(process.pid)
              if (
                  leader_identity[2:] != (os.getpid(), process.pid, process.pid)
                  or process_identity(process.pid) != leader_identity
              ):
                  record_cleanup_failure("identity_mismatch")
          except (OSError, ValueError, UnicodeError):
              record_cleanup_failure("inspection_error")

          def observe_selected_leader() -> int | None:
              observed = os.waitid(
                  os.P_PIDFD, leader_pidfd, os.WEXITED | os.WNOHANG | os.WNOWAIT
              )
              if observed is None:
                  return None
              if observed.si_code == os.CLD_EXITED:
                  return observed.si_status
              return -observed.si_status

          def reap_selected_leader(
              identity: tuple[int, int, int, int, int], deadline: float
          ) -> int | None:
              while True:
                  try:
                      if process_identity(identity[0]) != identity:
                          record_cleanup_failure("identity_mismatch")
                          return None
                      if observe_selected_leader() is not None:
                          waited_pid, status = os.waitpid(identity[0], os.WNOHANG)
                          if waited_pid == identity[0]:
                              process.returncode = os.waitstatus_to_exitcode(status)
                              return process.returncode
                  except (OSError, ValueError, UnicodeError):
                      record_cleanup_failure("unknown_exit_status")
                      return None
                  if time.monotonic() >= deadline:
                      return None
                  time.sleep(min(0.02, max(0, deadline - time.monotonic())))

          def child_pids() -> list[int]:
              try:
                  data = Path(
                      f"/proc/self/task/{os.getpid()}/children"
                  ).read_text(encoding="ascii")
                  return [int(value) for value in data.split()]
              except (OSError, UnicodeDecodeError, ValueError):
                  record_cleanup_failure("inspection_error")
                  raise

          def group_exists(deadline: float) -> bool:
              if observe_selected_leader() is None:
                  return True
              for entry in Path("/proc").iterdir():
                  if time.monotonic() >= deadline:
                      raise TimeoutError
                  if not entry.name.isdecimal() or int(entry.name) == process.pid:
                      continue
                  try:
                      identity, state = process_snapshot(int(entry.name))
                      if identity[3] == process.pid and state != "Z":
                          return True
                  except FileNotFoundError:
                      continue
              return False

          def signal_process(
              identity: tuple[int, int, int, int, int],
              pidfd: int,
              selected_signal: signal.Signals,
              deadline: float,
              *,
              group: bool = False,
          ) -> None:
              if group and identity[2:] != (os.getpid(), process.pid, process.pid):
                  record_cleanup_failure("identity_mismatch")
                  return
              if process_identity(identity[0]) != identity:
                  record_cleanup_failure("identity_mismatch")
                  return
              if not group:
                  if identity[2] != os.getpid() or identity[0] not in child_pids():
                      record_cleanup_failure("identity_mismatch")
                      return
                  if os.waitid(os.P_PIDFD, pidfd, os.WEXITED | os.WNOHANG | os.WNOWAIT):
                      return
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  return
              try:
                  result = run_isolation_command(
                      [
                          str(trusted_kill),
                          f"-{selected_signal.name.removeprefix('SIG')}",
                          "--",
                          str(-identity[0] if group else identity[0]),
                      ],
                      check=False,
                      timeout=remaining,
                  )
              except subprocess.TimeoutExpired:
                  record_cleanup_failure("command_timeout")
                  if process_identity(identity[0]) != identity:
                      record_cleanup_failure("identity_mismatch")
                  return
              if result.returncode != 0:
                  if group:
                      try:
                          group_remains = group_exists(deadline)
                      except TimeoutError:
                          record_cleanup_failure("inspection_error")
                          raise
                      if not group_remains:
                          return
                  elif os.waitid(
                      os.P_PIDFD, pidfd, os.WEXITED | os.WNOHANG | os.WNOWAIT
                  ) is not None:
                      return
                  if process_identity(identity[0]) != identity:
                      record_cleanup_failure("identity_mismatch")
                      return
                  record_cleanup_failure("signal_error")

          adopted: dict[int, tuple[tuple[int, int, int, int, int], int]] = {}

          def inspect_adopted_children(deadline: float) -> list[int]:
              global escaped_descendant_observed
              live = []
              for child in child_pids():
                  if time.monotonic() >= deadline:
                      raise TimeoutError
                  if child == process.pid:
                      continue
                  if child not in adopted:
                      try:
                          identity = process_identity(child)
                      except (FileNotFoundError, ProcessLookupError):
                          continue
                      try:
                          descriptor = os.pidfd_open(child)
                      except (FileNotFoundError, ProcessLookupError):
                          continue
                      try:
                          valid = identity[2] == os.getpid() and process_identity(child) == identity
                      except (FileNotFoundError, ProcessLookupError):
                          reaped = False
                          try:
                              if os.waitid(
                                  os.P_PIDFD, descriptor, os.WEXITED | os.WNOHANG | os.WNOWAIT
                              ) is not None:
                                  waited, _ = os.waitpid(child, os.WNOHANG)
                                  reaped = waited == child
                          finally:
                              os.close(descriptor)
                          if reaped:
                              continue
                          raise
                      except (OSError, ValueError, UnicodeError):
                          os.close(descriptor)
                          raise
                      if not valid:
                          os.close(descriptor)
                          record_cleanup_failure("identity_mismatch")
                          live.append(child)
                          continue
                      adopted[child] = (identity, descriptor)
                  identity, descriptor = adopted[child]
                  if os.waitid(
                      os.P_PIDFD, descriptor, os.WEXITED | os.WNOHANG | os.WNOWAIT
                  ) is not None:
                      waited, _ = os.waitpid(child, os.WNOHANG)
                      if waited == child:
                          os.close(descriptor)
                          del adopted[child]
                          continue
                  if process_identity(child) != identity:
                      record_cleanup_failure("identity_mismatch")
                      live.append(child)
                      continue
                  live.append(child)
              return live

          def cleanup_selected_processes(
              cleanup_deadline: float, *, cooperative_time_exhausted: bool,
          ) -> tuple[str, int | None]:
              leader_status = None
              stable_empty = 0
              term_deadline = min(cleanup_deadline, time.monotonic() + term_grace)
              cleanup_phases = (
                  ((signal.SIGKILL, cleanup_deadline),)
                  if cooperative_time_exhausted
                  else (
                      (signal.SIGTERM, term_deadline),
                      (signal.SIGKILL, cleanup_deadline),
                  )
              )
              for selected_signal, deadline in cleanup_phases:
                  group_signaled = False
                  signaled: set[tuple[int, int, int, int, int]] = set()
                  while time.monotonic() < deadline:
                      try:
                          children = inspect_adopted_children(deadline)
                          group_live = group_exists(deadline)
                          if group_live and not group_signaled:
                              signal_process(
                                  leader_identity, leader_pidfd, selected_signal,
                                  deadline, group=True,
                              )
                              group_signaled = True
                          for child in children:
                              held = adopted.get(child)
                              if held is not None and held[0] not in signaled:
                                  signal_process(*held, selected_signal, deadline)
                                  signaled.add(held[0])
                          if not children and not group_live:
                              stable_empty += 1
                              if stable_empty >= 2:
                                  break
                          else:
                              stable_empty = 0
                      except subprocess.TimeoutExpired:
                          record_cleanup_failure("command_timeout")
                      except TimeoutError:
                          break
                      except (OSError, ValueError, UnicodeError):
                          record_cleanup_failure("inspection_error")
                          stable_empty = 0
                      time.sleep(min(0.02, max(0, deadline - time.monotonic())))
                  if stable_empty >= 2:
                      break
              leader_status = reap_selected_leader(
                  leader_identity, cleanup_deadline
              )
              if leader_status is None:
                  record_cleanup_failure("unknown_exit_status")
              if stable_empty < 2:
                  record_cleanup_failure("unreaped_child")
                  return "live_or_unknown", leader_status
              return ("uncertain" if cleanup_failure else "complete"), leader_status

          tail: collections.deque[bytes] = collections.deque()
          tail_size = 0
          output_bytes = 0
          overflow = False
          output_stalled = False
          process_group_leaked = False
          pipe_closed = False
          pipe_closed_at: float | None = None
          process_exited_at: float | None = None
          namespace_return_code: int | None = None
          cooperative_time_exhausted = False
          selector = selectors.DefaultSelector()
          selector.register(process.stdout, selectors.EVENT_READ)
          try:
              while True:
                  if interrupted_signal or overflow or output_stalled:
                      break
                  try:
                      ready = selector.select(timeout=0.1)
                  except InterruptedError:
                      continue
                  for key, _ in ready:
                      chunk = os.read(key.fileobj.fileno(), 65536)
                      if not chunk:
                          pipe_closed = True
                          pipe_closed_at = pipe_closed_at or time.monotonic()
                          selector.unregister(key.fileobj)
                          break
                      output_bytes += len(chunk)
                      tail.append(chunk)
                      tail_size += len(chunk)
                      while tail and tail_size - len(tail[0]) >= tail_limit:
                          tail_size -= len(tail.popleft())
                      if tail_size > tail_limit:
                          trim = tail_size - tail_limit
                          tail[0] = tail[0][trim:]
                          tail_size = tail_limit
                      if output_bytes > output_limit:
                          overflow = True
                          break
                  return_code = observe_selected_leader()
                  now = time.monotonic()
                  if return_code is not None and process_exited_at is None:
                      process_exited_at = now
                  if return_code is not None and namespace_return_code is None:
                      namespace_status = read_phase_status(
                          "final", allow_missing_status=True
                      )
                      if namespace_status is not None:
                          namespace_return_code = namespace_status["selected_exit_status"]
                  if return_code is not None and pipe_closed:
                      break
                  if (
                      return_code is not None
                      and process_exited_at is not None
                      and now - process_exited_at > pipe_close_grace
                  ) or (
                      pipe_closed
                      and pipe_closed_at is not None
                      and now - pipe_closed_at > pipe_close_grace
                  ):
                      output_stalled = True
          except (OSError, ValueError, UnicodeError):
              record_cleanup_failure("inspection_error")
          finally:
              if interrupted_signal or overflow or output_stalled:
                  try:
                      cooperative_deadline = time.monotonic() + (2 * term_grace) + 1
                      fresh_leader_return_code = observe_selected_leader()
                      if (
                          fresh_leader_return_code is None
                          and request_phase_termination(
                              "final", deadline=cooperative_deadline
                          )
                      ):
                          while time.monotonic() < cooperative_deadline:
                              ready = selector.select(timeout=0.02) if selector.get_map() else []
                              for key, _ in ready:
                                  chunk = os.read(key.fileobj.fileno(), 65536)
                                  if not chunk:
                                      pipe_closed = True
                                      selector.unregister(key.fileobj)
                                      continue
                                  output_bytes += len(chunk)
                                  tail.append(chunk)
                                  tail_size += len(chunk)
                                  while tail and tail_size - len(tail[0]) >= tail_limit:
                                      tail_size -= len(tail.popleft())
                                  if tail_size > tail_limit:
                                      trim = tail_size - tail_limit
                                      tail[0] = tail[0][trim:]
                                      tail_size = tail_limit
                              if observe_selected_leader() is not None and pipe_closed:
                                  break
                  except (
                      OSError,
                      ValueError,
                      SystemExit,
                      subprocess.TimeoutExpired,
                      TimeoutError,
                  ):
                      record_cleanup_failure("inspection_error")
                  cooperative_time_exhausted = time.monotonic() >= cooperative_deadline
              selector.close()
              process.stdout.close()
              cleanup_deadline = time.monotonic() + (2 * term_grace) + 1
              cleanup_state, namespace_return_code = cleanup_selected_processes(
                  cleanup_deadline,
                  cooperative_time_exhausted=cooperative_time_exhausted,
              )
              process_group_leaked = cleanup_state != "complete"
              for signum, previous in previous_handlers.items():
                  signal.signal(signum, previous)
              if leader_pidfd >= 0:
                  os.close(leader_pidfd)
              for _identity, descriptor in adopted.values():
                  os.close(descriptor)
          return_code = None
          try:
              namespace_record = read_phase_status("final", allow_missing_status=True)
              if namespace_record is None:
                  if cleanup_state == "complete":
                      cleanup_state = "uncertain"
                  process_group_leaked = True
                  record_cleanup_failure("unknown_exit_status")
              else:
                  return_code = namespace_record["selected_exit_status"]
                  if namespace_record["cleanup"] == "inspection_failed":
                      process_group_leaked = True
                      record_cleanup_failure("inspection_error")
                  elif namespace_record["cleanup"] == "descendant_survived":
                      process_group_leaked = True
                      record_cleanup_failure("unreaped_child")
                  elif namespace_record["cleanup"] == "descendant_terminated":
                      escaped_descendant_observed = True
                  expected_namespace_return_code = (
                      return_code
                      if namespace_record["cleanup"] == "clean" and 0 <= return_code <= 124
                      else 125
                  )
                  if namespace_return_code != expected_namespace_return_code:
                      process_group_leaked = True
                      record_cleanup_failure("unknown_exit_status")
                      raise SystemExit("root namespace exit mapping disagrees")
          except (OSError, ValueError, UnicodeDecodeError, json.JSONDecodeError, SystemExit):
              process_group_leaked = True
              record_cleanup_failure("inspection_error")
          try:
              verify_tracked_source(source_directory)
              verify_tracked_source(staged_source)
              verify_trusted_tools()
              verify_policy_inputs()
              if execution_identity() != execution_binding:
                  raise SystemExit("root execution directory changed after final execution")
              if input_identity(staged_source, owner=selected_uid) != staged_source_binding:
                  raise SystemExit("root execution source changed after final execution")
              if input_identity(staged_bin) != staged_uv_binding:
                  raise SystemExit("root execution uv input changed after final execution")
              if dependency_input_manifest() != dependency_manifest:
                  raise SystemExit("root dependency manifest changed after final execution")
          except (OSError, ValueError, UnicodeError, SystemExit):
              record_cleanup_failure("identity_mismatch")
          tail_bytes = b"".join(tail)[-tail_limit:]
          raw_tail_bytes = tail_bytes

          def private_name(prefix: str) -> str:
              return f".{prefix}.{os.urandom(16).hex()}"

          def write_command_file(
              directory_descriptor: int,
              name: str,
              mode: int,
              content: bytes,
          ) -> None:
              temporary_name = private_name("comet-root-command")
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(
                  temporary_name,
                  flags,
                  mode,
                  dir_fd=directory_descriptor,
              )
              installed = False
              try:
                  os.fchmod(descriptor, mode)
                  write_all(descriptor, content)
                  os.fsync(descriptor)
                  os.replace(
                      temporary_name,
                      name,
                      src_dir_fd=directory_descriptor,
                      dst_dir_fd=directory_descriptor,
                  )
                  installed = True
              finally:
                  os.close(descriptor)
                  if not installed:
                      try:
                          os.unlink(temporary_name, dir_fd=directory_descriptor)
                      except FileNotFoundError:
                          pass

          def repair_visible_directory(
              bindings: list[tuple[str, int, int, int, int]],
          ) -> tuple[int, bool]:
              descriptor = os.open("/", directory_flags)
              tampered = False
              try:
                  for component, device, inode, owner, mode in bindings:
                      try:
                          current = os.stat(
                              component,
                              dir_fd=descriptor,
                              follow_symlinks=False,
                          )
                      except FileNotFoundError:
                          current = None
                      matches = current is not None and (
                          stat.S_ISDIR(current.st_mode)
                          and (
                              current.st_dev,
                              current.st_ino,
                              current.st_uid,
                              current.st_mode,
                          )
                          == (device, inode, owner, mode)
                      )
                      if not tampered and matches:
                          next_descriptor = os.open(
                              component,
                              directory_flags,
                              dir_fd=descriptor,
                          )
                      else:
                          tampered = True
                          if owner != os.geteuid():
                              raise SystemExit(
                                  "runner directory path cannot be reconstructed"
                              )
                          if current is not None:
                              os.rename(
                                  component,
                                  private_name("comet-root-selected-directory"),
                                  src_dir_fd=descriptor,
                                  dst_dir_fd=descriptor,
                              )
                          os.mkdir(
                              component,
                              stat.S_IMODE(mode),
                              dir_fd=descriptor,
                          )
                          next_descriptor = os.open(
                              component,
                              directory_flags,
                              dir_fd=descriptor,
                          )
                          os.fchmod(next_descriptor, stat.S_IMODE(mode))
                          os.fsync(descriptor)
                      os.close(descriptor)
                      descriptor = next_descriptor
                  return descriptor, tampered
              except BaseException:
                  os.close(descriptor)
                  raise

          def restore_runner_command_files() -> tuple[int, bool]:
              visible_runner_descriptor, runner_path_tampered = (
                  repair_visible_directory(runner_path_bindings)
              )
              visible_runner_status = os.fstat(visible_runner_descriptor)
              if (
                  not stat.S_ISDIR(visible_runner_status.st_mode)
                  or visible_runner_status.st_uid != os.geteuid()
                  or visible_runner_status.st_mode & 0o022
              ):
                  raise SystemExit("runner directory cannot be rebound safely")
              try:
                  named = os.stat(
                      command_directory.name,
                      dir_fd=visible_runner_descriptor,
                      follow_symlinks=False,
                  )
              except FileNotFoundError:
                  named = None
              opened = os.fstat(command_directory_descriptor)
              named_identity = None if named is None else (
                  named.st_dev,
                  named.st_ino,
                  named.st_uid,
                  named.st_mode,
              )
              if (
                  not runner_path_tampered
                  and named_identity == command_directory_identity
                  and (
                  opened.st_dev,
                  opened.st_ino,
                  opened.st_uid,
                  opened.st_mode,
                  )
                  == command_directory_identity
              ):
                  tampered = False
                  for (
                      name,
                      mode,
                      device,
                      inode,
                      original_descriptor,
                      content,
                  ) in channel_snapshots.values():
                      try:
                          current = os.stat(
                              name,
                              dir_fd=command_directory_descriptor,
                              follow_symlinks=False,
                          )
                      except FileNotFoundError:
                          current = None
                      if current is None or not stat.S_ISREG(current.st_mode) or (
                          current.st_dev,
                          current.st_ino,
                      ) != (device, inode):
                          tampered = True
                      opened = os.fstat(original_descriptor)
                      if (opened.st_dev, opened.st_ino) != (device, inode):
                          raise SystemExit("runner command file changed identity")
                      write_command_file(
                          command_directory_descriptor,
                          name,
                          mode,
                          content,
                      )
                      os.close(original_descriptor)
                  os.fchmod(command_directory_descriptor, command_directory_mode)
                  os.fsync(command_directory_descriptor)
                  os.close(visible_runner_descriptor)
                  return command_directory_descriptor, tampered

              prepared_name = private_name("comet-root-command-directory")
              os.mkdir(
                  prepared_name,
                  0o700,
                  dir_fd=visible_runner_descriptor,
              )
              prepared_descriptor = os.open(
                  prepared_name,
                  directory_flags,
                  dir_fd=visible_runner_descriptor,
              )
              installed = False
              try:
                  for (
                      name,
                      mode,
                      _device,
                      _inode,
                      original_descriptor,
                      content,
                  ) in channel_snapshots.values():
                      write_command_file(prepared_descriptor, name, mode, content)
                      os.close(original_descriptor)
                  os.fsync(prepared_descriptor)
                  if named is not None:
                      quarantine_name = private_name("comet-root-selected-command-directory")
                      os.rename(
                          command_directory.name,
                          quarantine_name,
                          src_dir_fd=visible_runner_descriptor,
                          dst_dir_fd=visible_runner_descriptor,
                      )
                  os.rename(
                      prepared_name,
                      command_directory.name,
                      src_dir_fd=visible_runner_descriptor,
                      dst_dir_fd=visible_runner_descriptor,
                  )
                  os.fchmod(prepared_descriptor, command_directory_mode)
                  os.fsync(visible_runner_descriptor)
                  installed = True
                  os.close(visible_runner_descriptor)
                  return prepared_descriptor, True
              finally:
                  if not installed:
                      os.close(prepared_descriptor)

          trusted_output_descriptor = os.dup(channel_snapshots["GITHUB_OUTPUT"][4])
          restored_command_directory_descriptor: int | None = None
          try:
              if uv_identity() != trusted_uv_identity:
                  raise SystemExit("root test uv executable changed")
              selected_parent_opened = os.fstat(selected_directory_descriptor)
              if (
                  not stat.S_ISDIR(selected_parent_opened.st_mode)
                  or (selected_parent_opened.st_dev, selected_parent_opened.st_ino)
                  != selected_directory_identity
                  or selected_parent_opened.st_uid != selected_uid
                  or selected_parent_opened.st_gid != selected_gid
                  or stat.S_IMODE(selected_parent_opened.st_mode) != 0o755
              ):
                  raise SystemExit("root test isolation parent directory changed")
              selected_opened = os.fstat(selected_descriptor)
              if (
                  not stat.S_ISDIR(selected_opened.st_mode)
                  or (selected_opened.st_dev, selected_opened.st_ino) != selected_identity
                  or selected_opened.st_uid != selected_uid
                  or selected_opened.st_gid != selected_gid
                  or stat.S_IMODE(selected_opened.st_mode) != 0o755
              ):
                  raise SystemExit("root test isolation directory changed")
          except subprocess.TimeoutExpired:
              record_cleanup_failure("command_timeout")
          except (OSError, ValueError, UnicodeError, SystemExit):
              record_cleanup_failure("identity_mismatch")
          try:
              restored_command_directory_descriptor, command_directory_tampered = (
                  restore_runner_command_files()
              )
              if command_directory_tampered:
                  record_cleanup_failure("identity_mismatch")
          except (OSError, ValueError, UnicodeError, SystemExit):
              record_cleanup_failure("identity_mismatch")
          if restored_command_directory_descriptor is not None:
              try:
                  verify_tracked_source(source_directory)
                  verify_tracked_source(staged_source)
                  if execution_identity() != execution_binding:
                      raise SystemExit("root execution directory changed")
                  verify_trusted_tools()
                  verify_policy_inputs()
                  if input_identity(staged_source, owner=selected_uid) != staged_source_binding:
                      raise SystemExit("root execution source changed")
                  if input_identity(staged_bin) != staged_uv_binding:
                      raise SystemExit("root execution uv input changed")
                  if hashlib.sha256(dependency_input_manifest()).hexdigest() != dependency_manifest_sha256:
                      raise SystemExit("root dependency manifest changed")
              except (OSError, ValueError, UnicodeError, SystemExit):
                  record_cleanup_failure("identity_mismatch")

          def write_new(name: str, data: bytes) -> None:
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(name, flags, 0o600, dir_fd=evidence_descriptor)
              try:
                  with os.fdopen(descriptor, "wb") as handle:
                      handle.write(data)
                      handle.flush()
                      os.fsync(handle.fileno())
              except OSError:
                  record_cleanup_failure("evidence_write_error")
                  raise

          def copy_selected_junit() -> bool:
              source_flags = os.O_RDONLY
              if hasattr(os, "O_CLOEXEC"):
                  source_flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  source_flags |= os.O_NOFOLLOW
              try:
                  source_descriptor = os.open(
                      "root-junit.xml",
                      source_flags,
                      dir_fd=selected_descriptor,
                  )
              except FileNotFoundError:
                  return False
              try:
                  source_status = os.fstat(source_descriptor)
                  limit = int(os.environ["JUNIT_LIMIT_BYTES"])
                  if (
                      not stat.S_ISREG(source_status.st_mode)
                      or source_status.st_uid != selected_uid
                      or source_status.st_gid != selected_gid
                      or source_status.st_mode & 0o022
                      or source_status.st_size == 0
                      or source_status.st_size > limit
                  ):
                      raise SystemExit("selected root JUnit evidence is invalid")
                  chunks: list[bytes] = []
                  remaining = source_status.st_size
                  while remaining:
                      chunk = os.read(source_descriptor, min(remaining, 1024 * 1024))
                      if not chunk:
                          raise SystemExit("selected root JUnit evidence is incomplete")
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  write_new("root-junit.xml", b"".join(chunks))
                  return True
              finally:
                  os.close(source_descriptor)

          def discard_staged_junit() -> None:
              try:
                  os.unlink("root-junit.xml", dir_fd=evidence_descriptor)
              except FileNotFoundError:
                  pass

          junit_available = False
          diagnostic_failure = (
              cleanup_failure is not None
              or return_code is None
              or overflow
              or output_stalled
              or escaped_descendant_observed
              or interrupted_signal != 0
          )
          try:
              if not diagnostic_failure:
                  junit_available = copy_selected_junit()
                  if not junit_available:
                      record_cleanup_failure("missing_junit")
          except (OSError, ValueError, SystemExit):
              record_cleanup_failure("evidence_write_error")
          finally:
              os.close(selected_descriptor)
              os.close(selected_directory_descriptor)
              for writable_descriptor in writable_directory_descriptors.values():
                  os.close(writable_descriptor)
              for dependency_descriptor, _relative in dependency_directory_descriptors:
                  os.close(dependency_descriptor)
          diagnostic_failure = (
              cleanup_failure is not None
              or return_code is None
              or overflow
              or output_stalled
              or escaped_descendant_observed
              or interrupted_signal != 0
          )
          if diagnostic_failure:
              discard_staged_junit()
          result = {
              "execution": {
                  "boundary_version": 2,
                  "bwrap_path": str(trusted_bwrap),
                  "bwrap_sha256": trusted_bwrap_sha256,
                  "bwrap_size": trusted_bwrap_size,
                  "bwrap_version": trusted_bwrap_version,
                  "dependency_manifest_sha256": dependency_manifest_sha256,
                  "isolation_gid": selected_gid,
                  "isolation_group": "nogroup",
                  "isolation_uid": selected_uid,
                  "isolation_user": "nobody",
                  "junit_transport": "selected-private-file",
                  "launcher": ["/usr/bin/sudo", "/usr/bin/bwrap", "/usr/bin/python3"],
                  "python_path": str(trusted_python),
                  "python_sha256": trusted_python_sha256,
                  "python_size": trusted_python_size,
                  "python_version": trusted_python_version,
                  "source_mount": "read-only-with-three-writable-leaves",
                  "uv_sha256": trusted_uv_identity[3],
                  "uv_size": trusted_uv_identity[2],
                  "working_directory": "/workspace",
              },
              "exit_code": return_code,
              "interrupted_signal": interrupted_signal,
              "output_bytes": output_bytes,
              "output_stalled": output_stalled,
              "overflow": overflow,
              "process_group_leaked": process_group_leaked,
              "source_sha": os.environ["SOURCE_SHA"],
              "test_command": test_command,
              "workflow_sha": os.environ["WORKFLOW_SHA"],
          }
          if diagnostic_failure:
              if overflow:
                  supervisor_failure = "output_overflow"
              elif output_stalled:
                  supervisor_failure = "output_stalled"
              elif interrupted_signal:
                  supervisor_failure = "interrupted"
              elif cleanup_failure is not None:
                  supervisor_failure = cleanup_failure
              elif escaped_descendant_observed:
                  supervisor_failure = "escaped_descendant"
              else:
                  supervisor_failure = "unknown_exit_status"
              result["cleanup_state"] = cleanup_state
              result["supervisor_failure"] = supervisor_failure
              diagnostic_tail_bytes = (
                  f"supervisor_cleanup_failure={supervisor_failure}\n".encode("ascii")
              )
              tail_bytes = (tail_bytes + diagnostic_tail_bytes)[-tail_limit:]
              raw_tail_bytes = diagnostic_tail_bytes
          evidence_write_failed = False
          result_bytes = (
              json.dumps(result, separators=(",", ":"), sort_keys=True) + "\n"
          ).encode("utf-8")
          if len(result_bytes) > result_limit:
              raise SystemExit("root command result exceeds its size limit")
          try:
              write_new("root-command-result.json", result_bytes)
          except OSError:
              record_cleanup_failure("evidence_write_error")
              evidence_write_failed = True
          try:
              write_new("root-command-tail.txt", tail_bytes)
          except OSError:
              record_cleanup_failure("evidence_write_error")
              evidence_write_failed = True
          if evidence_write_failed:
              discard_staged_junit()
              raise SystemExit(1)
          check_directory_identity()

          raw_directory = Path(
              tempfile.mkdtemp(prefix="comet-root-raw.", dir=runner_temp)
          )
          raw_directory.chmod(0o700)
          raw_descriptor = os.open(raw_directory, directory_flags)

          def copy_to_raw(name: str, limit: int, *, allow_empty: bool = False) -> None:
              source_flags = os.O_RDONLY
              if hasattr(os, "O_CLOEXEC"):
                  source_flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  source_flags |= os.O_NOFOLLOW
              source_descriptor = os.open(name, source_flags, dir_fd=evidence_descriptor)
              try:
                  source_status = os.fstat(source_descriptor)
                  if (
                      not stat.S_ISREG(source_status.st_mode)
                      or source_status.st_uid != os.geteuid()
                      or source_status.st_mode & 0o022
                      or source_status.st_size > limit
                      or (not allow_empty and source_status.st_size == 0)
                  ):
                      raise SystemExit("root raw evidence is invalid before upload")
                  destination_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_CLOEXEC"):
                      destination_flags |= os.O_CLOEXEC
                  if hasattr(os, "O_NOFOLLOW"):
                      destination_flags |= os.O_NOFOLLOW
                  destination_descriptor = os.open(
                      name,
                      destination_flags,
                      0o600,
                      dir_fd=raw_descriptor,
                  )
                  try:
                      remaining = source_status.st_size
                      while remaining:
                          chunk = os.read(source_descriptor, min(remaining, 1024 * 1024))
                          if not chunk:
                              raise SystemExit("root raw evidence ended before its size")
                          write_all(destination_descriptor, chunk)
                          remaining -= len(chunk)
                      os.fsync(destination_descriptor)
                  finally:
                      os.close(destination_descriptor)
              finally:
                  os.close(source_descriptor)

          def write_raw(name: str, data: bytes, limit: int) -> None:
              if len(data) > limit:
                  raise SystemExit("root raw evidence is invalid before upload")
              destination_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_CLOEXEC"):
                  destination_flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  destination_flags |= os.O_NOFOLLOW
              destination_descriptor = os.open(
                  name,
                  destination_flags,
                  0o600,
                  dir_fd=raw_descriptor,
              )
              try:
                  write_all(destination_descriptor, data)
                  os.fsync(destination_descriptor)
              finally:
                  os.close(destination_descriptor)

          copy_to_raw("root-command-result.json", result_limit)
          if diagnostic_failure:
              write_raw("root-command-tail.txt", raw_tail_bytes, tail_limit)
          else:
              copy_to_raw("root-command-tail.txt", tail_limit, allow_empty=True)
          if junit_available:
              copy_to_raw("root-junit.xml", int(os.environ["JUNIT_LIMIT_BYTES"]))
          os.close(raw_descriptor)

          (
              output_name,
              _output_mode,
              output_device,
              output_inode,
              _original_descriptor,
              original_output,
          ) = channel_snapshots["GITHUB_OUTPUT"]
          if restored_command_directory_descriptor is not None:
              os.close(trusted_output_descriptor)
              output_flags = os.O_WRONLY | os.O_APPEND
              if hasattr(os, "O_CLOEXEC"):
                  output_flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  output_flags |= os.O_NOFOLLOW
              output_descriptor = os.open(
                  output_name,
                  output_flags,
                  dir_fd=restored_command_directory_descriptor,
              )
          else:
              output_status = os.fstat(trusted_output_descriptor)
              if (
                  not stat.S_ISREG(output_status.st_mode)
                  or output_status.st_uid != os.geteuid()
                  or output_status.st_mode & 0o022
                  or (output_status.st_dev, output_status.st_ino)
                  != (output_device, output_inode)
              ):
                  raise SystemExit("runner output file changed identity")
              os.lseek(trusted_output_descriptor, 0, os.SEEK_END)
              output_descriptor = trusted_output_descriptor
          try:
              if original_output and not original_output.endswith(b"\n"):
                  write_all(output_descriptor, b"\n")
              write_all(
                  output_descriptor,
                  f"raw_directory={raw_directory}\nraw_ready=true\n".encode("utf-8"),
              )
              os.fsync(output_descriptor)
          finally:
              os.close(output_descriptor)
          if overflow:
              print("Root test output exceeded its byte limit.", file=sys.stderr)
              raise SystemExit(1)
          if output_stalled or process_group_leaked:
              print("Root test process group did not terminate cleanly.", file=sys.stderr)
              raise SystemExit(1)
          if escaped_descendant_observed:
              print(
                  "A root test descendant escaped from the selected process group.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          if interrupted_signal:
              print("Root test command was interrupted.", file=sys.stderr)
              raise SystemExit(128 + interrupted_signal)
          if cleanup_failure is not None:
              print("Root test supervisor did not complete safely.", file=sys.stderr)
              raise SystemExit(
                  return_code if return_code is not None and 0 < return_code <= 125 else 1
              )
          if not junit_available and return_code == 0:
              print("Root JUnit evidence is missing.", file=sys.stderr)
              raise SystemExit(1)
          raise SystemExit(return_code if 0 <= return_code <= 125 else 1)
          PY
      - name: Upload raw root evidence
        if: ${{ always() && steps.root-test.outputs.raw_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-test-profile-raw
          path: |
            ${{ steps.root-test.outputs.raw_directory }}/root-command-result.json
            ${{ steps.root-test.outputs.raw_directory }}/root-command-tail.txt
            ${{ steps.root-test.outputs.raw_directory }}/root-junit.xml
          if-no-files-found: error
          retention-days: 1

  root-validation:
    needs: root
    if: ${{ always() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: root-directories
        name: Prepare trusted root directories
        shell: bash
        env:
          ROOT_JOB_RESULT: ${{ needs.root.result }}
          RUNNER_TEMP: ${{ runner.temp }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          umask 077
          input_directory="$(mktemp -d "${RUNNER_TEMP}/comet-root-input.XXXXXX")"
          output_directory="$(mktemp -d "${RUNNER_TEMP}/comet-root-output.XXXXXX")"
          diagnostic_directory="$(mktemp -d "${RUNNER_TEMP}/comet-root-diagnostic.XXXXXX")"
          printf 'workflow_sha=%s\ntested_sha=%s\n' "${WORKFLOW_SHA}" "${SOURCE_SHA}" \
            > "${diagnostic_directory}/source.txt"
          printf 'root_job_result=%s\n' "${ROOT_JOB_RESULT}" \
            > "${diagnostic_directory}/root-job-result.txt"
          printf 'input=%s\n' "${input_directory}" >> "${GITHUB_OUTPUT}"
          printf 'input_device=%s\n' "$(stat -c %d -- "${input_directory}")" >> "${GITHUB_OUTPUT}"
          printf 'input_inode=%s\n' "$(stat -c %i -- "${input_directory}")" >> "${GITHUB_OUTPUT}"
          printf 'output=%s\n' "${output_directory}" >> "${GITHUB_OUTPUT}"
          printf 'output_device=%s\n' "$(stat -c %d -- "${output_directory}")" >> "${GITHUB_OUTPUT}"
          printf 'output_inode=%s\n' "$(stat -c %i -- "${output_directory}")" >> "${GITHUB_OUTPUT}"
          printf 'diagnostic=%s\n' "${diagnostic_directory}" >> "${GITHUB_OUTPUT}"
          printf 'diagnostic_device=%s\n' "$(stat -c %d -- "${diagnostic_directory}")" >> "${GITHUB_OUTPUT}"
          printf 'diagnostic_inode=%s\n' "$(stat -c %i -- "${diagnostic_directory}")" >> "${GITHUB_OUTPUT}"
      - name: Download raw root evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: root-test-profile-raw
          path: ${{ steps.root-directories.outputs.input }}
      - name: Validate raw root evidence
        if: ${{ always() }}
        shell: bash
        env:
          DIAGNOSTIC_TAIL_BYTES: "65536"
          DIAGNOSTIC_DEVICE: ${{ steps.root-directories.outputs.diagnostic_device }}
          DIAGNOSTIC_DIRECTORY: ${{ steps.root-directories.outputs.diagnostic }}
          DIAGNOSTIC_INODE: ${{ steps.root-directories.outputs.diagnostic_inode }}
          EVIDENCE_DEVICE: ${{ steps.root-directories.outputs.input_device }}
          EVIDENCE_DIRECTORY: ${{ steps.root-directories.outputs.input }}
          EVIDENCE_INODE: ${{ steps.root-directories.outputs.input_inode }}
          JUNIT_LIMIT_BYTES: "67108864"
          OUTPUT_DIRECTORY: ${{ steps.root-directories.outputs.output }}
          OUTPUT_DEVICE: ${{ steps.root-directories.outputs.output_device }}
          OUTPUT_INODE: ${{ steps.root-directories.outputs.output_inode }}
          OUTPUT_LIMIT_BYTES: "16777216"
          RECEIPT_LIMIT_BYTES: "1024"
          RESULT_LIMIT_BYTES: "2048"
          ROOT_JOB_RESULT: ${{ needs.root.result }}
          RUNNER_TEMP: ${{ runner.temp }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SUMMARY_LIMIT_BYTES: "8388608"
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: /usr/bin/python3 -I scripts/ci/validate-root-profile-evidence.py
      - name: Upload root qualification evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-test-profile-evidence
          path: ${{ steps.root-directories.outputs.output }}
          if-no-files-found: error
      - name: Upload root diagnostic evidence
        if: ${{ failure() && steps.root-directories.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-test-profile-diagnostics
          retention-days: 1
          path: ${{ steps.root-directories.outputs.diagnostic }}
          if-no-files-found: error

  postgres:
    needs: root
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/postgres-tests.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  contract-selection:
    runs-on: ubuntu-24.04
    outputs:
      contract_matrix: ${{ steps.classify.outputs.contract_matrix }}
    steps:
      - name: Validate the source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || "${EVENT_REF}" != "refs/heads/main" ]]; then
            echo "::error::Manual contract validation must use the main workflow." >&2
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The source commit must be a full lowercase hexadecimal SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "${WORKFLOW_SHA}"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - id: classify
        name: Select promotion contracts
        env:
          CHANGES0: ${{ runner.temp }}/deployed-input-changes0
        run: |
          : > "${CHANGES0}"
          uv run --locked --extra dev python scripts/check_deployed_inputs.py classify --changes0 "${CHANGES0}" --profile promotion --github-output "${GITHUB_OUTPUT}"

  contracts:
    needs: contract-selection
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/contracts.yml
    with:
      matrix: ${{ needs.contract-selection.outputs.contract_matrix }}
      ref: ${{ inputs.source_sha }}
