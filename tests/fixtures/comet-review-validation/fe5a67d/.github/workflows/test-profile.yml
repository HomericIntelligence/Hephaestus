              if (opened.st_dev, opened.st_ino, opened.st_mode, opened.st_uid, opened.st_gid, opened.st_nlink) != identity or (named.st_dev, named.st_ino) != identity[:2]:
                  raise SystemExit("namespace record changed")

          def status_write(descriptor, path, identity, selected, cleanup):
              data = (json.dumps({"cleanup": cleanup, "schema": 1, "selected_exit_status": selected}, separators=(",", ":"), sort_keys=True) + "\\n").encode("utf-8")
