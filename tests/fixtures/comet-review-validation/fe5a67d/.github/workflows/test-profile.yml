              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise SystemExit("root namespace record inspection is malformed") from error
              if result.stdout != (
                  json.dumps(snapshot, separators=(",", ":"), sort_keys=True) + "\n"
              ).encode("utf-8"):
