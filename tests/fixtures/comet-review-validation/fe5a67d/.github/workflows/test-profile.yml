                      (
                          relative,
                          "directory",
                          directory_mode,
                          opened_directory.st_uid,
                          opened_directory.st_gid,
                          opened_directory.st_size,
                          "",
                          "",
                      )
                  )
                  for name in sorted(os.listdir(descriptor)):
                      child_relative = f"{relative}/{name}"
                      named = os.stat(name, dir_fd=descriptor, follow_symlinks=False)
                      mode = stat.S_IMODE(named.st_mode)
                      if named.st_uid != selected_uid or named.st_gid != selected_gid:
                          raise SystemExit("root dependency manifest ownership or mode is invalid")
                      if stat.S_ISDIR(named.st_mode):
                          child = os.open(name, directory_flags, dir_fd=descriptor)
                          try:
                              opened = os.fstat(child)
                              if (opened.st_dev, opened.st_ino) != (named.st_dev, named.st_ino):
                                  raise SystemExit("root dependency manifest identity changed")
                              inspect(child, child_relative)
                          finally:
                              os.close(child)
                          continue
                      if stat.S_ISREG(named.st_mode):
                          if mode & 0o022:
                              raise SystemExit("root dependency manifest ownership or mode is invalid")
                          child = os.open(
                              name,
                              os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC,
                              dir_fd=descriptor,
                          )
                          try:
                              opened = os.fstat(child)
                              if (
                                  (opened.st_dev, opened.st_ino) != (named.st_dev, named.st_ino)
                                  or opened.st_uid != selected_uid
                                  or opened.st_gid != selected_gid
                                  or stat.S_IMODE(opened.st_mode) != mode
                                  or opened.st_size != named.st_size
                              ):
                                  raise SystemExit("root dependency manifest identity changed")
                              digest = hashlib.sha256()
                              while chunk := os.read(child, 1024 * 1024):
                                  digest.update(chunk)
                          finally:
                              os.close(child)
                          entries.append(
                              (
                                  child_relative,
                                  "file",
                                  mode,
                                  opened.st_uid,
                                  opened.st_gid,
                                  opened.st_size,
                                  "",
                                  digest.hexdigest(),
                              )
                          )
                          continue
                      if stat.S_ISLNK(named.st_mode):
                          target = os.readlink(name, dir_fd=descriptor)
                          if child_relative in permitted_python_links:
                              target_descriptor = os.open(name, os.O_RDONLY | os.O_CLOEXEC, dir_fd=descriptor)
