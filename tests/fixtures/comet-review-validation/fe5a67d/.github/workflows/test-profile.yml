              result = subprocess.run(
                  arguments,
                  cwd="/",
                  env=isolation_environment,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  timeout=remaining_timeout(deadline),
                  check=False,
