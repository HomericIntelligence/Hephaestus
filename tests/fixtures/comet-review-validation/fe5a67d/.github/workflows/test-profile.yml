              return snapshot

          def remaining_timeout(deadline: float | None = None) -> float:
              if deadline is None:
                  return term_grace
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError
              return remaining

          def create_phase_records() -> dict[str, dict[str, object]]:
              records_by_phase: dict[str, dict[str, object]] = {}
              if execution_identity() != execution_binding:
                  raise SystemExit("root execution directory changed before record creation")
              verify_policy_inputs()
              execution_status = execution_directory.stat(follow_symlinks=False)
              for phase_name in ("prepare", "final"):
                  token = os.urandom(16).hex()
                  receiver_path = execution_directory / f".comet-root-{phase_name}-record-fds.{token}"
                  receiver = socket.socket(socket.AF_UNIX, socket.SOCK_SEQPACKET)
                  try:
                      receiver.bind(str(receiver_path))
                      receiver_path.chmod(0o600)
