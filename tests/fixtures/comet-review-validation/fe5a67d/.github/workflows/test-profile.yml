          def checked_record(path, expected):
              descriptor = os.open(path, os.O_RDWR | os.O_NOFOLLOW | os.O_CLOEXEC)
              opened = os.fstat(descriptor)
              named = os.stat(path, follow_symlinks=False)
              if (
                  not stat.S_ISREG(opened.st_mode)
                  or opened.st_uid != 0
                  or opened.st_gid != 0
