                  raise SystemExit("namespace record is invalid")
              if expected is not None and os.pread(descriptor, 2, 0) != expected:
                  raise SystemExit("namespace control record is invalid")
              return descriptor, (opened.st_dev, opened.st_ino, opened.st_mode, opened.st_uid, opened.st_gid, opened.st_nlink)

          def recheck(path, descriptor, identity):
