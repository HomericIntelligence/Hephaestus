          def input_identity(path: Path, *, owner: int = os.geteuid()) -> tuple[object, ...]:
              entries: list[tuple[object, ...]] = []

              def inspect(descriptor: int, relative: str) -> None:
                  opened = os.fstat(descriptor)
                  if opened.st_uid != owner or opened.st_mode & 0o022:
                      raise SystemExit("root execution input ownership or mode changed")
                  entries.append(
                      (relative, opened.st_dev, opened.st_ino, opened.st_uid, opened.st_gid, opened.st_mode)
                  )
                  for name in sorted(os.listdir(descriptor)):
                      relative_name = f"{relative}/{name}"
                      status = os.stat(name, dir_fd=descriptor, follow_symlinks=False)
                      if status.st_uid != owner:
                          raise SystemExit("root execution input ownership changed")
                      if stat.S_ISDIR(status.st_mode):
                          child = os.open(name, directory_flags, dir_fd=descriptor)
                          try:
                              if (os.fstat(child).st_dev, os.fstat(child).st_ino) != (
                                  status.st_dev,
                                  status.st_ino,
                              ):
                                  raise SystemExit("root execution input identity changed")
                              inspect(child, relative_name)
                          finally:
                              os.close(child)
                      elif stat.S_ISLNK(status.st_mode):
                          if relative_name.startswith("./.git/"):
                              raise SystemExit("root execution Git metadata contains a link")
                          entries.append(
                              (
                                  relative_name,
                                  status.st_dev,
                                  status.st_ino,
                                  status.st_uid,
                                  status.st_gid,
                                  status.st_mode,
                                  os.readlink(name, dir_fd=descriptor),
                              )
                          )
                      elif stat.S_ISREG(status.st_mode) and not status.st_mode & 0o022:
                          child = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=descriptor)
                          try:
                              opened = os.fstat(child)
                              if opened.st_uid != owner or opened.st_mode & 0o022:
                                  raise SystemExit("root execution input ownership or mode changed")
                              if (opened.st_dev, opened.st_ino) != (status.st_dev, status.st_ino):
                                  raise SystemExit("root execution input identity changed")
                              digest = hashlib.sha256()
                              while chunk := os.read(child, 1024 * 1024):
                                  digest.update(chunk)
                              entries.append(
                                  (
                                      relative_name,
                                      opened.st_dev,
                                      opened.st_ino,
                                      opened.st_uid,
                                      opened.st_gid,
                                      opened.st_mode,
                                      opened.st_size,
                                      digest.hexdigest(),
                                  )
                              )
                          finally:
                              os.close(child)
                      else:
                          raise SystemExit("root execution input type or mode is not safe")

              descriptor = os.open(path, directory_flags)
              try:
                  inspect(descriptor, ".")
              finally:
                  os.close(descriptor)
              return tuple(entries)

          def dependency_input_manifest() -> bytes:
              entries: list[tuple[object, ...]] = []
              python_links: set[str] = set()
              permitted_python_links = {
