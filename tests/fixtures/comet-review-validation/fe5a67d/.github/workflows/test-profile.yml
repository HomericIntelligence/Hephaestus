              def inspect(descriptor: int, relative: str) -> None:
                  opened_directory = os.fstat(descriptor)
                  directory_mode = stat.S_IMODE(opened_directory.st_mode)
                  if (
                      not stat.S_ISDIR(opened_directory.st_mode)
                      or opened_directory.st_uid != selected_uid
                      or opened_directory.st_gid != selected_gid
