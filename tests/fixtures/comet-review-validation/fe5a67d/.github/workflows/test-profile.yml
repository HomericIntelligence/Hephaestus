name: test-profile

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase commit SHA to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || "${EVENT_REF}" != "refs/heads/main" ]]; then
            echo "::error::Manual root validation must use the main workflow." >&2
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The source commit must be a full lowercase hexadecimal SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - id: evidence
        name: Prepare root evidence
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          umask 077
          runner_temp="$(realpath -e -- "${RUNNER_TEMP}")"
          evidence_directory="$(mktemp -d "${runner_temp}/comet-root-evidence.XXXXXX")"
          evidence_directory="$(realpath -e -- "${evidence_directory}")"
          case "${evidence_directory}" in
            "${runner_temp}"/*) ;;
            *) echo "::error::Root evidence directory escaped RUNNER_TEMP." >&2; exit 1 ;;
          esac
          test ! -L "${evidence_directory}"
          test "$(stat -c %u -- "${evidence_directory}")" = "$(id -u)"
          test "$(stat -c %a -- "${evidence_directory}")" = "700"
          printf 'directory=%s\n' "${evidence_directory}" >> "${GITHUB_OUTPUT}"
          printf 'device=%s\n' "$(stat -c %d -- "${evidence_directory}")" >> "${GITHUB_OUTPUT}"
          printf 'inode=%s\n' "$(stat -c %i -- "${evidence_directory}")" >> "${GITHUB_OUTPUT}"
          test ! -L /tmp
          test "$(stat -c %u /tmp)" = 0
          test "$(stat -c %a /tmp)" = 1777
          execution_directory="$(mktemp -d /tmp/comet-root-execution.XXXXXX)"
          chmod 755 -- "${execution_directory}"
          printf 'execution_directory=%s\n' "${execution_directory}" >> "${GITHUB_OUTPUT}"
          printf 'execution_device=%s\n' "$(stat -c %d -- "${execution_directory}")" >> "${GITHUB_OUTPUT}"
          printf 'execution_inode=%s\n' "$(stat -c %i -- "${execution_directory}")" >> "${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
      - id: root-test
        name: Run the complete root profile
        shell: bash
        env:
          DIAGNOSTIC_TAIL_BYTES: "65536"
          EVIDENCE_DIRECTORY: ${{ steps.evidence.outputs.directory }}
          EVIDENCE_DEVICE: ${{ steps.evidence.outputs.device }}
          EVIDENCE_INODE: ${{ steps.evidence.outputs.inode }}
          EXECUTION_DIRECTORY: ${{ steps.evidence.outputs.execution_directory }}
          EXECUTION_DEVICE: ${{ steps.evidence.outputs.execution_device }}
          EXECUTION_INODE: ${{ steps.evidence.outputs.execution_inode }}
          JUNIT_LIMIT_BYTES: "67108864"
          OUTPUT_LIMIT_BYTES: "16777216"
          PIPE_CLOSE_GRACE_SECONDS: "1"
          PROCESS_TERM_GRACE_SECONDS: "5"
          RESULT_LIMIT_BYTES: "2048"
          RUNNER_TEMP: ${{ runner.temp }}
          SOURCE_DIRECTORY: ${{ github.workspace }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_INVENTORY_LIMIT_BYTES: "16777216"
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          exec /usr/bin/python3 -I - <<'PY'
          import array
          import collections
          import ctypes
          import grp
          import hashlib
          import json
          import math
          import os
          import pwd
          import re
          import selectors
          import shutil
          import signal
          import socket
          import stat
          import struct
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIRECTORY"])
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          source_directory = Path(os.environ["SOURCE_DIRECTORY"])
          output_limit = int(os.environ["OUTPUT_LIMIT_BYTES"])
          result_limit = int(os.environ["RESULT_LIMIT_BYTES"])
          tail_limit = int(os.environ["DIAGNOSTIC_TAIL_BYTES"])
          pipe_close_grace = float(os.environ.get("PIPE_CLOSE_GRACE_SECONDS", "1"))
          term_grace = float(os.environ.get("PROCESS_TERM_GRACE_SECONDS", "5"))
          if (
              output_limit < 1
              or result_limit != 2048
              or tail_limit < 1
              or not math.isfinite(pipe_close_grace)
              or not math.isfinite(term_grace)
              or not 0 < pipe_close_grace <= 30
              or not 0 < term_grace <= 30
          ):
              raise SystemExit("root test process limits are invalid")
          libc = ctypes.CDLL(None, use_errno=True)
          if libc.prctl(36, 1, 0, 0, 0) != 0:
              raise SystemExit("root test process cannot become a child subreaper")
          if (
              not evidence.is_absolute()
              or not runner_temp.is_absolute()
              or not source_directory.is_absolute()
              or not source_directory.is_dir()
              or evidence.parent != runner_temp
              or source_directory == evidence
              or evidence.name in ("", ".", "..")
          ):
              raise SystemExit("root evidence directory is not canonical under RUNNER_TEMP")
          directory_flags = os.O_RDONLY
          if hasattr(os, "O_CLOEXEC"):
              directory_flags |= os.O_CLOEXEC
          if hasattr(os, "O_DIRECTORY"):
              directory_flags |= os.O_DIRECTORY
          if hasattr(os, "O_NOFOLLOW"):
              directory_flags |= os.O_NOFOLLOW

          def open_and_bind_directory(
              path: Path,
          ) -> tuple[int, list[tuple[str, int, int, int, int]]]:
              if not path.is_absolute() or any(
                  component in ("", ".", "..") for component in path.parts[1:]
              ):
                  raise SystemExit("runner directory path is invalid")
              descriptor = os.open("/", directory_flags)
              bindings: list[tuple[str, int, int, int, int]] = []
              try:
                  for component in path.parts[1:]:
                      next_descriptor = os.open(
                          component,
                          directory_flags,
                          dir_fd=descriptor,
                      )
                      opened = os.fstat(next_descriptor)
                      named = os.stat(
                          component,
                          dir_fd=descriptor,
                          follow_symlinks=False,
                      )
                      if (
                          not stat.S_ISDIR(named.st_mode)
                          or (named.st_dev, named.st_ino)
                          != (opened.st_dev, opened.st_ino)
                      ):
                          raise SystemExit("runner directory path is invalid")
                      bindings.append(
                          (
                              component,
                              opened.st_dev,
                              opened.st_ino,
                              opened.st_uid,
                              opened.st_mode,
                          )
                      )
                      os.close(descriptor)
                      descriptor = next_descriptor
                  return descriptor, bindings
              except BaseException:
                  os.close(descriptor)
                  raise

          try:
              runner_descriptor, runner_path_bindings = open_and_bind_directory(
                  runner_temp
              )
              evidence_descriptor = os.open(
                  evidence.name, directory_flags, dir_fd=runner_descriptor
              )
          except OSError as error:
              raise SystemExit("root evidence directory cannot be opened safely") from error
          directory_status = os.fstat(evidence_descriptor)
          expected_device = os.environ["EVIDENCE_DEVICE"]
          expected_inode = os.environ["EVIDENCE_INODE"]
          if (
              not expected_device.isascii()
              or not expected_device.isdecimal()
              or not expected_inode.isascii()
              or not expected_inode.isdecimal()
              or (directory_status.st_dev, directory_status.st_ino)
              != (int(expected_device), int(expected_inode))
          ):
              raise SystemExit("root evidence directory does not match the prepared identity")
          directory_identity = (
              directory_status.st_dev,
              directory_status.st_ino,
              directory_status.st_uid,
              directory_status.st_mode,
          )
          if (
              not stat.S_ISDIR(directory_status.st_mode)
              or directory_status.st_uid != os.geteuid()
              or stat.S_IMODE(directory_status.st_mode) != 0o700
          ):
              raise SystemExit("root evidence directory is not caller-private")

          def check_directory_identity() -> None:
              try:
                  named = os.stat(
                      evidence.name,
                      dir_fd=runner_descriptor,
                      follow_symlinks=False,
                  )
                  opened = os.fstat(evidence_descriptor)
              except OSError as error:
                  raise SystemExit(
                      "root evidence directory changed during capture"
                  ) from error
              for observed in (named, opened):
                  if (
                      observed.st_dev,
                      observed.st_ino,
                      observed.st_uid,
                      observed.st_mode,
                  ) != directory_identity:
                      raise SystemExit("root evidence directory changed during capture")

          check_directory_identity()

          def write_all(descriptor: int, data: bytes) -> None:
              view = memoryview(data)
              while view:
                  written = os.write(descriptor, view)
                  if written == 0:
                      raise SystemExit("trusted evidence write did not progress")
                  view = view[written:]

          channel_names = (
              "GITHUB_ENV",
              "GITHUB_OUTPUT",
              "GITHUB_PATH",
              "GITHUB_STATE",
              "GITHUB_STEP_SUMMARY",
          )
          try:
              selected_account = pwd.getpwnam("nobody")
              selected_group = grp.getgrnam("nogroup")
          except KeyError as error:
              raise SystemExit("root test isolation identity is unavailable") from error
          selected_uid = selected_account.pw_uid
          selected_gid = selected_group.gr_gid
          if (
              selected_uid != 65534
              or selected_gid != 65534
              or selected_account.pw_gid != 65534
              or selected_account.pw_name != "nobody"
              or selected_group.gr_name != "nogroup"
          ):
              raise SystemExit("root test isolation identity is invalid")
          trusted_sudo = Path("/usr/bin/sudo")
          trusted_bwrap = Path("/usr/bin/bwrap")
          trusted_chown = Path("/usr/bin/chown")
          trusted_chmod = Path("/usr/bin/chmod")
          trusted_kill = Path("/usr/bin/kill")
          trusted_python = Path("/usr/bin/python3")
          trusted_setpriv = Path("/usr/bin/setpriv")
          trusted_git = Path("/usr/bin/git")
          for trusted_program in (
              trusted_sudo,
              trusted_bwrap,
              trusted_chown,
              trusted_chmod,
              trusted_kill,
              trusted_python,
              trusted_setpriv,
              trusted_git,
          ):
              trusted_status = trusted_program.stat(follow_symlinks=True)
              if (
                  not stat.S_ISREG(trusted_status.st_mode)
                  or trusted_status.st_uid != 0
                  or trusted_status.st_mode & 0o022
              ):
                  raise SystemExit("root test isolation program is invalid")

          def executable_identity(program: Path) -> tuple[int, str]:
              status = program.stat(follow_symlinks=True)
              hasher = hashlib.sha256()
              with program.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      hasher.update(chunk)
              return status.st_size, hasher.hexdigest()

          def executable_version(program: Path) -> str:
              result = subprocess.run(
                  [str(program), "--version"],
                  cwd="/",
                  env={"LANG": "C", "LC_ALL": "C", "PATH": "/usr/bin:/bin"},
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  timeout=30,
                  check=True,
              )
              version = result.stdout.decode("ascii").strip()
              if re.fullmatch(r"[ -~]{1,64}", version) is None:
                  raise SystemExit("root test executable version is invalid")
              return version

          try:
              trusted_python_target = trusted_python.resolve(strict=True)
          except OSError as error:
              raise SystemExit("root test Python interpreter target is unavailable") from error
          trusted_python_target_status = trusted_python_target.stat(follow_symlinks=False)
          if (
              not stat.S_ISREG(trusted_python_target_status.st_mode)
              or trusted_python_target_status.st_uid != 0
              or trusted_python_target_status.st_mode & 0o022
          ):
              raise SystemExit("root test Python interpreter target is invalid")
          trusted_python_descriptor = os.open(
              trusted_python_target, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC
          )
          trusted_bwrap_size, trusted_bwrap_sha256 = executable_identity(trusted_bwrap)
          trusted_bwrap_version = executable_version(trusted_bwrap)
          trusted_python_size, trusted_python_sha256 = executable_identity(trusted_python_target)
          trusted_python_version = executable_version(trusted_python)
          if not trusted_python_version.startswith("Python 3.12."):
              raise SystemExit("root test Python interpreter is not version 3.12")
          trusted_tool_identities = {
              str(program): executable_identity(program)
              for program in (
                  trusted_sudo,
                  trusted_bwrap,
                  trusted_chown,
                  trusted_chmod,
                  trusted_kill,
                  trusted_setpriv,
                  trusted_git,
              )
          }
          trusted_tool_descriptors = {
              name: os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
              for name in trusted_tool_identities
          }

          def verify_trusted_tools() -> None:
              for name, identity in trusted_tool_identities.items():
                  descriptor_status = os.fstat(trusted_tool_descriptors[name])
                  named_status = os.stat(name, follow_symlinks=True)
                  if (
                      executable_identity(Path(name)) != identity
                      or (descriptor_status.st_dev, descriptor_status.st_ino, descriptor_status.st_size)
                      != (named_status.st_dev, named_status.st_ino, named_status.st_size)
                  ):
                      raise SystemExit("root trusted tool changed")
              descriptor_status = os.fstat(trusted_python_descriptor)
              named_status = trusted_python.stat(follow_symlinks=True)
              if (
                  executable_identity(trusted_python_target)
                  != (trusted_python_size, trusted_python_sha256)
                  or (descriptor_status.st_dev, descriptor_status.st_ino, descriptor_status.st_size)
                  != (named_status.st_dev, named_status.st_ino, named_status.st_size)
              ):
                  raise SystemExit("root test Python interpreter changed")
              descriptor_status = os.fstat(trusted_uv_descriptor)
              named_status = trusted_uv_path.stat(follow_symlinks=True)
              if (
                  uv_identity() != trusted_uv_identity
                  or (descriptor_status.st_dev, descriptor_status.st_ino, descriptor_status.st_size)
                  != (named_status.st_dev, named_status.st_ino, named_status.st_size)
              ):
                  raise SystemExit("root test uv executable changed")
          command_directory = runner_temp / "_runner_file_commands"
          try:
              command_directory_descriptor = os.open(
                  command_directory.name,
                  directory_flags,
                  dir_fd=runner_descriptor,
              )
          except OSError as error:
              raise SystemExit("runner command directory cannot be opened safely") from error
          command_directory_status = os.fstat(command_directory_descriptor)
          command_directory_mode = stat.S_IMODE(command_directory_status.st_mode)
          if (
              not stat.S_ISDIR(command_directory_status.st_mode)
              or command_directory_status.st_uid != os.geteuid()
              or command_directory_status.st_mode & 0o022
          ):
              raise SystemExit("runner command directory is not caller-controlled")
          os.fchmod(command_directory_descriptor, 0o700)
          command_directory_status = os.fstat(command_directory_descriptor)
          command_directory_identity = (
              command_directory_status.st_dev,
              command_directory_status.st_ino,
              command_directory_status.st_uid,
              command_directory_status.st_mode,
          )
          if (
              not stat.S_ISDIR(command_directory_status.st_mode)
              or command_directory_status.st_uid != os.geteuid()
              or stat.S_IMODE(command_directory_status.st_mode) != 0o700
          ):
              raise SystemExit("runner command directory is not caller-private")
          channel_snapshots: dict[str, tuple[str, int, int, int, int, bytes]] = {}
          for channel_name in channel_names:
              channel_value = os.environ.get(channel_name)
              if channel_value is None:
                  continue
              channel_path = Path(channel_value)
              if (
                  not channel_path.is_absolute()
                  or channel_path.parent != command_directory
                  or channel_path.name in ("", ".", "..")
                  or channel_path.name in {
                      snapshot[0] for snapshot in channel_snapshots.values()
                  }
              ):
                  raise SystemExit("runner command file path is invalid")
              flags = os.O_RDWR
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(
                  channel_path.name,
                  flags,
                  dir_fd=command_directory_descriptor,
              )
              status = os.fstat(descriptor)
              if (
                  not stat.S_ISREG(status.st_mode)
                  or status.st_uid != os.geteuid()
                  or status.st_size > 65536
              ):
                  raise SystemExit("runner command file is invalid")
              chunks: list[bytes] = []
              remaining = status.st_size
              while remaining:
                  chunk = os.read(descriptor, remaining)
                  if not chunk:
                      raise SystemExit("runner command file read is incomplete")
                  chunks.append(chunk)
                  remaining -= len(chunk)
              content = b"".join(chunks)
              original_mode = stat.S_IMODE(status.st_mode)
              os.fchmod(descriptor, 0o600)
              protected_status = os.fstat(descriptor)
              if stat.S_IMODE(protected_status.st_mode) != 0o600:
                  raise SystemExit("runner command file cannot be protected")
              channel_snapshots[channel_name] = (
                  channel_path.name,
                  original_mode,
                  status.st_dev,
                  status.st_ino,
                  descriptor,
                  content,
              )
          def verify_tracked_source(checkout: Path) -> None:
              source_sha = os.environ["SOURCE_SHA"]
              if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
                  raise SystemExit("root source identity is invalid")
              inventory_limit = int(os.environ["SOURCE_INVENTORY_LIMIT_BYTES"])
              if not 0 < inventory_limit <= 16 * 1024 * 1024:
                  raise SystemExit("root source inventory limit is invalid")
              root_descriptor = os.open(checkout, directory_flags)
              try:
                  git_descriptor = os.open(
                      ".git",
                      directory_flags,
                      dir_fd=root_descriptor,
                  )
                  objects_descriptor = os.open(
                      "objects",
                      directory_flags,
                      dir_fd=git_descriptor,
                  )
              except OSError as error:
                  raise SystemExit("root Git object directory is not canonical") from error
              git_status = os.fstat(git_descriptor)
              objects_status = os.fstat(objects_descriptor)
              named_git = os.stat(
                  ".git",
                  dir_fd=root_descriptor,
                  follow_symlinks=False,
              )
              named_objects = os.stat(
                  "objects",
                  dir_fd=git_descriptor,
                  follow_symlinks=False,
              )
              if (
                  not stat.S_ISDIR(named_git.st_mode)
                  or not stat.S_ISDIR(named_objects.st_mode)
                  or (named_git.st_dev, named_git.st_ino)
                  != (git_status.st_dev, git_status.st_ino)
                  or (named_objects.st_dev, named_objects.st_ino)
                  != (objects_status.st_dev, objects_status.st_ino)
              ):
                  raise SystemExit("root Git object directory is not canonical")
              object_directory = f"/proc/self/fd/{objects_descriptor}"
              verification = Path(
                  tempfile.mkdtemp(prefix="comet-root-git.", dir=runner_temp)
              )
              template = verification / "template"
              repository = verification / "repository.git"
              template.mkdir(mode=0o700)
              base_environment = {
                  "GIT_ALLOW_PROTOCOL": "file",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_OPTIONAL_LOCKS": "0",
                  "GIT_TERMINAL_PROMPT": "0",
                  "LANG": "C",
                  "PATH": "/usr/bin:/bin",
              }
              initialized = subprocess.run(
                  [
                      "/usr/bin/git",
                      "--no-replace-objects",
                      "init",
                      "--bare",
                      f"--template={template}",
                      str(repository),
                  ],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  env=base_environment,
                  timeout=30,
              )
              if initialized.returncode != 0:
                  raise SystemExit("private Git verification did not initialize")
              git_environment = {
                  **base_environment,
                  "GIT_ALTERNATE_OBJECT_DIRECTORIES": str(object_directory),
                  "GIT_DIR": str(repository),
                  "GIT_INDEX_FILE": str(verification / "index"),
                  "GIT_WORK_TREE": str(checkout),
              }

              def git(*arguments: str, limit: int = 1024 * 1024) -> bytes:
                  process = subprocess.Popen(
                      ["/usr/bin/git", "--no-replace-objects", *arguments],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      env=git_environment,
                      pass_fds=(objects_descriptor,),
                      start_new_session=True,
                  )
                  assert process.stdout is not None
                  output_descriptor = process.stdout.fileno()
                  os.set_blocking(output_descriptor, False)
                  output_selector = selectors.DefaultSelector()
                  output_selector.register(output_descriptor, selectors.EVENT_READ)
                  deadline = time.monotonic() + 60
                  chunks: list[bytes] = []
                  size = 0
                  failed = False
                  try:
                      while True:
                          remaining_time = deadline - time.monotonic()
                          if remaining_time <= 0:
                              failed = True
                              break
                          events = output_selector.select(min(remaining_time, 0.25))
                          if not events:
                              if process.poll() is not None:
                                  chunk = os.read(
                                      output_descriptor,
                                      min(65536, limit + 1 - size),
                                  )
                                  if not chunk:
                                      break
                                  chunks.append(chunk)
                                  size += len(chunk)
                                  if size > limit:
                                      failed = True
                                      break
                              continue
                          chunk = os.read(
                              output_descriptor,
                              min(65536, limit + 1 - size),
                          )
                          if not chunk:
                              break
                          chunks.append(chunk)
                          size += len(chunk)
                          if size > limit:
                              failed = True
                              break
                      if failed:
                          os.killpg(process.pid, signal.SIGKILL)
                      try:
                          return_code = process.wait(
                              timeout=max(0.1, deadline - time.monotonic())
                          )
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=5)
                          failed = True
                  finally:
                      output_selector.close()
                      process.stdout.close()
                      if process.poll() is None:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=5)
                  if failed or return_code != 0:
                      raise SystemExit("private Git verification failed")
                  return b"".join(chunks)

              if git("rev-parse", "--show-object-format").strip() != b"sha1":
                  raise SystemExit("root source does not use SHA-1 objects")

              def identities() -> tuple[bytes, bytes]:
                  commit = git("rev-parse", f"{source_sha}^{{commit}}").strip()
                  tree = git("rev-parse", f"{source_sha}^{{tree}}").strip()
                  if commit != source_sha.encode("ascii") or re.fullmatch(
                      rb"[0-9a-f]{40}", tree
                  ) is None:
                      raise SystemExit("root source object identity is invalid")
                  git(
                      "fsck",
                      "--strict",
                      "--no-dangling",
                      "--no-reflogs",
                      "--no-progress",
                      source_sha,
                  )
                  return commit, tree

              before = identities()
              git("read-tree", source_sha)
              inventory = git(
                  "ls-tree",
                  "-rz",
                  "--full-tree",
                  source_sha,
                  limit=inventory_limit,
              )
              records = inventory.split(b"\0")
              if not records or records[-1] != b"" or len(records) > 200000:
                  raise SystemExit("root source tree inventory is invalid")
              try:
                  for record in records[:-1]:
                      header, separator, path = record.partition(b"\t")
                      fields = header.split(b" ")
                      components = path.split(b"/")
                      if (
                          separator != b"\t"
                          or len(fields) != 3
                          or len(components) == 0
                          or any(component in (b"", b".", b"..") for component in components)
                          or re.fullmatch(rb"[0-7]{6}", fields[0]) is None
                          or fields[1] not in (b"blob", b"commit")
                          or re.fullmatch(rb"[0-9a-f]{40}", fields[2]) is None
                      ):
                          raise SystemExit("root source tree entry is invalid")
                      mode = fields[0]
                      if fields[1] == b"commit" or mode == b"160000":
                          raise SystemExit("root source tree contains an unsupported gitlink")
                      parent_descriptor = os.dup(root_descriptor)
                      try:
                          for component in components[:-1]:
                              next_descriptor = os.open(
                                  component,
                                  directory_flags,
                                  dir_fd=parent_descriptor,
                              )
                              os.close(parent_descriptor)
                              parent_descriptor = next_descriptor
                          name = components[-1]
                          observed = os.stat(
                              name,
                              dir_fd=parent_descriptor,
                              follow_symlinks=False,
                          )
                          if mode == b"120000":
                              if not stat.S_ISLNK(observed.st_mode):
                                  raise SystemExit("root tracked source type changed")
                              data = os.readlink(name, dir_fd=parent_descriptor).encode(
                                  "utf-8", "surrogateescape"
                              )
                              digest = hashlib.sha1(
                                  f"blob {len(data)}\0".encode("ascii") + data,
                                  usedforsecurity=False,
                              ).hexdigest()
                          else:
                              if not stat.S_ISREG(observed.st_mode):
                                  raise SystemExit("root tracked source type changed")
                              executable = bool(observed.st_mode & 0o111)
                              if executable != (mode == b"100755"):
                                  raise SystemExit("root tracked source mode changed")
                              file_flags = os.O_RDONLY
                              if hasattr(os, "O_CLOEXEC"):
                                  file_flags |= os.O_CLOEXEC
                              if hasattr(os, "O_NOFOLLOW"):
                                  file_flags |= os.O_NOFOLLOW
                              file_descriptor = os.open(
                                  name, file_flags, dir_fd=parent_descriptor
                              )
                              try:
                                  hasher = hashlib.sha1(usedforsecurity=False)
                                  hasher.update(
                                      f"blob {observed.st_size}\0".encode("ascii")
                                  )
                                  remaining = observed.st_size
                                  while True:
                                      chunk = os.read(file_descriptor, 1024 * 1024)
                                      if not chunk:
                                          break
                                      hasher.update(chunk)
                                      remaining -= len(chunk)
                                  if remaining != 0:
                                      raise SystemExit("root tracked source read is incomplete")
                                  digest = hasher.hexdigest()
                              finally:
                                  os.close(file_descriptor)
                      finally:
                          os.close(parent_descriptor)
                      if digest.encode("ascii") != fields[2]:
                          raise SystemExit("root tracked source bytes changed")
              finally:
                  os.close(root_descriptor)
              if identities() != before:
                  raise SystemExit("root source object identity changed")
