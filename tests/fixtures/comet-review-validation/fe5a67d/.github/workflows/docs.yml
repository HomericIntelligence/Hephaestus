name: docs

# Build the MkDocs site in strict mode for pull requests, manual runs, and all
# pushes. Only an exact push to prod can enter either production environment.
on:
  push: {}
  workflow_dispatch: {}
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/ci/verify-current-prod.sh
      - wrangler.jsonc
      - .github/workflows/docs.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorize-production.outputs.authorized }}
    steps:
      - name: Authorize production source
        id: authorize-production
        shell: bash
        run: |
          set -euo pipefail
          authorized=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/prod" ]]; then
            authorized=true
          fi
          printf 'authorized=%s\n' "${authorized}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build site in strict mode
        run: uv run --locked --extra dev mkdocs build --strict
      - name: Validate Cloudflare configuration
        run: npx --yes wrangler@4.82.2 deploy --dry-run --config wrangler.jsonc
      - name: Upload Cloudflare site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-site
          path: site
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: site

  deploy-cloudflare:
    if: needs.build.outputs.authorized == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docs-cloudflare-production
      cancel-in-progress: false
    environment:
      name: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download Cloudflare site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-site
          path: site
      - name: Record deployed source
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          printf 'deploy_ref=%s\n' "${DEPLOY_REF}"
          printf 'deploy_sha=%s\n' "${DEPLOY_SHA}"
      - name: Verify current production source
        id: verify-current-prod
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-current-prod.sh
      - name: Deploy to docs.llm360.ai/comet (Cloudflare Workers)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.82.2"
          command: deploy --config wrangler.jsonc

  deploy-pages:
    if: needs.build.outputs.authorized == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-github-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record deployed source
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          printf 'deploy_ref=%s\n' "${DEPLOY_REF}"
          printf 'deploy_sha=%s\n' "${DEPLOY_SHA}"
      - name: Verify current production source
        id: verify-current-prod
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-current-prod.sh
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
